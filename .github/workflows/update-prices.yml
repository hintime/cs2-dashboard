name: Update Prices (fast, no AI)

# 高频价格线：只刷价格 / 评分 / 异动数据，不调用任何大模型。
# 与 "Update All CS2 Data"（低频、含 AI 深度分析）共用同一个 self-hosted runner，
# 因此共用 concurrency group，保证同一时间只跑一个，其余排队。

on:
  # ⚠️ 2026-09-16 已停用定时触发，改由本机调度器 updater_daemon.py 接管。
  # 原因：GitHub Actions 的 schedule 是"尽力而为"、不可靠（实测 2026-09-15
  # 连续 4 次调度全部缺席，数据停了 2.1 小时），且 self-hosted runner 的
  # Actions 作业常年卡在 Checkout 步骤后死去。
  # 本机调度器以当前用户身份常驻，30 分钟一跑，不依赖 GitHub 调度。
  # 如需临时启用，用 workflow_dispatch 手动触发即可。
  # schedule:
  #   - cron: '*/30 * * * *'   # 每 30 分钟
  workflow_dispatch:

concurrency:
  group: cs2-dashboard-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prices:
    runs-on: [windows, x64]
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repo (silent, no git console popup)
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: 'echo'
        run: |
          set PATH=C:\Users\Lenovo\AppData\Local\Programs\Python\Python312;C:\Users\Lenovo\AppData\Local\Programs\Python\Python312\Scripts;%PATH%
          python scripts\git_ops.py checkout

      - name: Setup Python (system)
        run: |
          set PATH=C:\Users\Lenovo\AppData\Local\Programs\Python\Python312;C:\Users\Lenovo\AppData\Local\Programs\Python\Python312\Scripts;%PATH%
          python --version

      - name: Configure git
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set PATH=C:\Users\Lenovo\AppData\Local\Programs\Python\Python312;C:\Users\Lenovo\AppData\Local\Programs\Python\Python312\Scripts;%PATH%
          python scripts\git_ops.py config

      - name: Update prices only (SKIP_AI=1)
        env:
          ECO_PRIVATE_KEY_B64: ${{ secrets.ECO_PRIVATE_KEY_B64 }}
          CSQ_API_TOKEN: ${{ secrets.CSQ_API_TOKEN }}
          CSQAQ_PROXY_URL: ${{ secrets.CSQAQ_PROXY_URL }}
          STEAMDT_KEY: ${{ secrets.STEAMDT_KEY }}
          FIREPULSE_KEY: ${{ secrets.FIREPULSE_KEY }}
          ENRICH_BUFF: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_AI: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: 'echo'
          GITHUB_ACTIONS: 'true'
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set PATH=C:\Users\Lenovo\AppData\Local\Programs\Python\Python312;C:\Users\Lenovo\AppData\Local\Programs\Python\Python312\Scripts;%PATH%
          echo === START update.py prices (SKIP_AI=1) ===
          python update.py prices 2>&1
          echo === END update.py prices ===

      - name: Show changed files
        run: |
          set PATH=C:\Users\Lenovo\AppData\Local\Programs\Python\Python312;C:\Users\Lenovo\AppData\Local\Programs\Python\Python312\Scripts;%PATH%
          python scripts\git_ops.py status

      - name: Commit and push
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: 'echo'
        run: |
          set PATH=C:\Users\Lenovo\AppData\Local\Programs\Python\Python312;C:\Users\Lenovo\AppData\Local\Programs\Python\Python312\Scripts;%PATH%
          python scripts\git_ops.py push

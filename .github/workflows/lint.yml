name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python lint（JSON 有效性 + 所有 HTML 结构 + 内联脚本括号配平）
        run: python lint.py
      - name: 内联 JS 语法检查（node vm.Script 编译，不执行）
        run: node scripts/check_inline_js.mjs

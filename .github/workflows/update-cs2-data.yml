name: Update CS2 Data

on:
  # ⚠️ 2026-09-12 已停用定时触发。
  # 原因：本 workflow（云端 ubuntu）与本机 self-hosted runner 的
  # "Update All CS2 Data" 功能完全重复，都是每 2 小时跑一遍 update.py all，
  # 造成重复抓取与重复消耗智谱 AI 额度；且云端每次都要靠种子文件重建数据库，
  # 数据底座不如本机（本机有完整 price_history.db）。
  # 数据更新现由 "Update All CS2 Data" 独家负责。
  # 如需临时启用，用 workflow_dispatch 手动触发即可。
  # schedule:
  #   - cron: '0 */2 * * *'  # 每2小时更新价格+异动
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 使用 Actions 内置的 GITHUB_TOKEN（每次运行自动签发、永不过期），
      # 不再依赖 secrets.GH_PAT，避免 PAT 过期导致 workflow 静默失效。
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pycryptodome

      - name: Configure git
        run: |
          git config user.email "hintime@users.noreply.github.com"
          git config user.name "hintime"

      - name: Update data
        env:
          ECO_PRIVATE_KEY_B64: ${{ secrets.ECO_PRIVATE_KEY_B64 }}
          CSQ_API_TOKEN: ${{ secrets.CSQ_API_TOKEN }}
          CSQAQ_PROXY_URL: ${{ secrets.CSQAQ_PROXY_URL }}
          STEAMDT_KEY: ${{ secrets.STEAMDT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== $(date) Running update.py ==="
          python update.py all 2>&1

      - name: Commit and push
        run: |
          git config user.email "hintime@users.noreply.github.com"
          git config user.name "hintime"
          git add -A
          git commit -m "chore: data update $(date +'%Y-%m-%d %H:%M')" --allow-empty || true
          git pull --rebase origin main || true
          git push

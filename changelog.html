<!DOCTYPE html>
<html data-v="20260601" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新日志 · CS2 饰品投资看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='none' stroke='%2360a5fa' stroke-width='2'/%3E%3Ctext x='20' y='27' font-size='22' text-anchor='middle' fill='%2360a5fa' font-family='Georgia,serif'%3E%CE%B1%3C/text%3E%3C/svg%3E">
<meta name="description" content="AlphaTrack · CS2 看板更新日志：功能迭代与数据口径变更记录。">
<meta property="og:title" content="更新日志 · CS2 饰品投资看板">
<meta property="og:description" content="AlphaTrack · CS2 看板更新日志：功能迭代与数据口径变更记录。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#020617">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;
  --border:#30363d;--border-hi:rgba(99,115,129,.5);--hair:rgba(48,54,61,.6);
  --text:#d1d5db;--text2:#9ca3af;--text3:#6b7280;
  --fall:#22c55e;--rise:#ef4444;--blue:#58a6fa;--amber:#fbbf24;
  --accent:#58a6fa;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC','PingFang SC','Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(96,165,250,.08),transparent),
    radial-gradient(ellipse 40% 40% at 80% 80%,rgba(168,85,247,.04),transparent);
  background-attachment:fixed;
}
.container{max-width:1080px;margin:0 auto;padding:32px 20px 48px}

.header{text-align:center;margin-bottom:28px}
.header h1{
  font-size:30px;font-weight:900;letter-spacing:-.03em;
  background:linear-gradient(135deg,#f0f0f0 0%,var(--blue) 50%,#a78bfa 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:8px;
}
.header .sub{font-size:13px;color:var(--text3);letter-spacing:.05em}
.header .back{
  display:inline-flex;align-items:center;gap:4px;margin-top:14px;
  padding:7px 15px;background:var(--surface2);
  border:1px solid var(--border);border-radius:14px;color:var(--text2);
  font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;
  transition:all .25s;
}
.header .back:hover{border-color:var(--blue);color:var(--blue)}

.stats-row{display:flex;gap:12px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.stat-pill{
  padding:7px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:14px;font-size:12px;color:var(--text2);font-weight:600;
  display:flex;align-items:center;gap:5px;
}
.stat-pill .num{color:var(--text);font-weight:800;font-family:'DM Mono',monospace}

/* ── 左右两列主从布局（同持仓明细）── */
.split{display:grid;grid-template-columns:390px 1fr;gap:16px;align-items:start}
.list-col{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  overflow-y:auto;max-height:calc(100vh - 250px);min-height:420px;overscroll-behavior:contain}
.list-col .ld{padding:10px 14px;border-bottom:1px solid var(--border);
  font-size:12px;color:var(--text3);font-weight:600;position:sticky;top:0;background:var(--surface2);z-index:2}
.day-head{padding:8px 14px 4px;font-size:11px;color:var(--text3);font-weight:700;
  display:flex;align-items:center;gap:6px}
.day-head::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}
.li{padding:10px 14px;border-bottom:1px solid var(--hair);cursor:pointer;transition:background .13s ease}
.li:hover{background:rgba(88,166,250,.06)}
.li.on{background:rgba(88,166,255,.1);box-shadow:inset 2px 0 0 var(--blue)}
.li .l-head{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.li .l-title{font-size:12.5px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.on .l-title{font-weight:600}
.li .l-time{font-size:10.5px;color:var(--text3);flex-shrink:0}

.e-tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:10px;flex-shrink:0;letter-spacing:.5px}
.e-tag.fix{background:rgba(248,113,113,.15);color:var(--rise)}
.e-tag.feat{background:rgba(88,166,250,.15);color:var(--blue)}
.e-tag.style{background:rgba(168,85,247,.15);color:#c084fc}
.e-tag.perf{background:rgba(52,211,153,.15);color:var(--fall)}
.e-tag.chore{background:rgba(148,163,184,.14);color:var(--text2)}
.e-tag.wip{background:rgba(251,191,36,.13);color:var(--amber)}
.e-tag.docs{background:rgba(52,211,153,.12);color:var(--fall)}

/* 右列详情 */
.detail-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;position:sticky;top:20px;min-height:420px}
.d-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;letter-spacing:.5px;display:inline-block;margin-bottom:10px}
.d-title{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.01em;line-height:1.4;margin-bottom:4px}
.d-date{font-size:12px;color:var(--text3);margin-bottom:14px;font-family:'DM Mono',monospace}
.d-sec{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.4px;margin:14px 0 6px}
.d-desc{font-size:13px;color:var(--text2);line-height:1.9}
.d-desc li{margin-left:18px;margin-bottom:4px}
.d-files{display:flex;flex-wrap:wrap;gap:5px}
.d-files code{background:var(--surface2);border:1px solid var(--hair);border-radius:5px;
  padding:2px 7px;font-size:11px;color:var(--text2);font-family:'DM Mono',monospace}
.d-raw{background:var(--surface2);border:1px solid var(--hair);border-radius:8px;
  padding:10px 12px;font-size:11.5px;color:var(--text3);font-family:'DM Mono',monospace;
  line-height:1.7;word-break:break-all}
.d-empty{padding:60px 20px;text-align:center;color:var(--text3);font-size:13px;line-height:2}

.footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}
.footer p{font-size:12px;color:var(--text3)}
.footer a{color:var(--blue);text-decoration:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.li{animation:fadeUp .35s ease backwards}

@media(max-width:860px){
  .split{grid-template-columns:1fr}
  .list-col{max-height:340px}
  .detail-col{position:static;min-height:0}
  .container{padding:22px 14px 40px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📋 更新日志</h1>
    <p class="sub">CS2 Dashboard · 每次修复/优化自动记录，中文说明</p>
    <a class="back" href="index.html">← 回到看板</a>
  </div>

  <div id="stats" class="stats-row"></div>
  <div class="split">
    <div class="list-col" id="listCol"><div class="ld">加载中…</div></div>
    <div class="detail-col" id="detailCol"></div>
  </div>

  <div class="footer">
    <p>数据来源：<a href="https://github.com/hintime/cs2-dashboard">hintime/cs2-dashboard</a> · 自动同步 git 提交记录，中文说明由提交信息解析生成</p>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   更新日志 —— 2026-09-25 重写：左右两列主从布局 + 中文说明
   左列：按日期分组的条目列表（tag 徽标 + 中文标题）
   右列：选中条目的中文详情（说明 / 涉及模块 / 原始记录）
   中文说明由 Conventional Commits 解析生成：
     type(scope): subject → 类型中文 + 模块中文 + 规则化详情
   数据源 changelog.json（update.py 自动同步 git 提交），字段 {date,tag,title,desc}
   ══════════════════════════════════════════════════════════════════ */

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ── 提交信息 → 中文 ── */
var TYPE_ZH = {
  feat: '新功能', fix: '问题修复', style: '界面样式', perf: '性能优化',
  chore: '例行维护', wip: '开发快照', docs: '文档', refactor: '重构'
};
var SCOPE_ZH = {
  fluct: '异动监控页', holdings: '持仓面板', revenue: '卖出复盘', backtest: '持仓回测',
  boards: '盘口监控', watchdog: '看门狗巡检', daemon: '本机调度器', git: '提交通道',
  index: '首页', dashboard: '看板', worker: '云函数', ai: 'AI 分析', kronos: '价格预测',
  changelog: '更新日志', data: '数据采集', lint: '代码检查'
};
/* 数据文件 → 中文类别 */
var FILE_ZH = [
  [/^market_overview|^market\.json|^market_scan|^market_sectors|^sectors|^correlation/, '行情与板块数据'],
  [/^market_history|^market_overview_history/, '行情历史序列'],
  [/^buff_history|^buff_recent|^fluct_recent/, '在售量历史快照'],
  [/^holdings/, '持仓数据'],
  [/^eco_tracked/, '追踪池全量数据'],
  [/^price_history|^price_summary/, '历史价格库'],
  [/^changelog/, '更新日志'],
  [/^data_status/, '采集状态标记'],
  [/^daily_report|^ai_/, 'AI 分析与日报'],
  [/^rec_|^firepulse/, '选品与追踪'],
  [/^csqaq_boards/, '盘口数据'],
  [/^news/, '资讯数据'],
  [/^name_map/, '中文名映射']
];
function fileCat(f) {
  for (var i = 0; i < FILE_ZH.length; i++) if (FILE_ZH[i][0].test(f.trim())) return FILE_ZH[i][1];
  return null;
}

/* 解析一条提交，产出 {typeZh, scopeZh, titleZh, detailLines[], files[], raw} */
function parseEntry(e) {
  var raw = String(e.title || e.desc || '');
  var type = (e.tag || 'chore').toLowerCase();
  var scope = '', subj = raw;
  var m = raw.match(/^(feat|fix|style|perf|chore|wip|docs|refactor|test|build|ci)(?:\(([^)]*)\))?\s*:\s*([\s\S]*)$/i);
  if (m) { type = m[1].toLowerCase(); scope = m[2] || ''; subj = m[3].trim(); }

  var titleZh = '', lines = [], files = [];

  if (type === 'wip' || /local snapshot/i.test(raw)) {
    titleZh = '本地开发快照（自动存档）';
    lines = ['这是开发过程中的自动存档：把当天的代码与数据状态固化一个版本，防止改动丢失。',
             '对使用没有直接影响，同类快照一天可能有多条。'];
  } else if (type === 'chore' && /^update /i.test(subj)) {
    var fl = subj.replace(/^update\s*/i, '').split(',').map(function (s) { return s.trim().replace(/\s*\d{4}-\d{2}-\d{2}\s*$/, ''); }).filter(Boolean);
    files = fl;
    var cats = [], seen = {};
    fl.forEach(function (f) {
      var c = fileCat(f);
      if (c && !seen[c]) { seen[c] = 1; cats.push(c); }
    });
    titleZh = '数据例行更新：' + (cats.length ? cats.join('、') : fl.length + ' 个数据文件');
    lines = ['这是采集任务的例行数据推送，把最新一轮抓到的价格、持仓与监控数据同步到网站。'];
    if (cats.indexOf('在售量历史快照') >= 0) lines.push('本次包含在售量历史快照：异动监控页的对比数据随之更新。');
    if (cats.indexOf('持仓数据') >= 0) lines.push('持仓的现价、涨跌与历史序列已刷新。');
    if (cats.indexOf('行情与板块数据') >= 0) lines.push('首页行情大盘与板块数据已刷新。');
    lines.push('共 ' + fl.length + ' 个数据文件，下方列出原文可逐个核对。');
  } else {
    /* feat/fix/style/perf：subject 多为中文，剥掉括号补充后直接用 */
    titleZh = subj.replace(/\s*（补提交）\s*$/, '').replace(/\s*\(补提交\)\s*$/, '');
    var scopeZh = scope ? (SCOPE_ZH[scope.toLowerCase()] || scope) : '';
    lines = [];
    if (scopeZh) lines.push('影响模块：' + scopeZh + '。');
    if (type === 'feat') lines.push('这次上线了新能力，属于功能增强，直接使用即可，无需额外操作。');
    else if (type === 'fix') lines.push('这次修复了一个已存在的问题；如果之前遇到过相关异常，更新后应不再复现。');
    else if (type === 'style') lines.push('这次只调整了界面观感（布局、配色、字号），数据和功能不受影响。');
    else if (type === 'perf') lines.push('这次优化了加载或运行效率，功能不变、速度更快。');
    else lines.push('本次为维护性改动，不影响日常使用。');
    var fm = subj.match(/[（(]([^）)]*(?:修复|调整|优化|改进)[^）)]*)[）)]/);
    if (fm) lines.push('补充说明：' + fm[1] + '。');
  }

  return {
    typeZh: TYPE_ZH[type] || type,
    scopeZh: scope ? (SCOPE_ZH[scope.toLowerCase()] || scope) : '',
    titleZh: titleZh || raw,
    lines: lines,
    files: files,
    raw: raw
  };
}

var ENTRIES = [], curIdx = -1;

function render() {
  var tagCount = {};
  ENTRIES.forEach(function (e) { tagCount[e.tag] = (tagCount[e.tag] || 0) + 1; });
  document.getElementById('stats').innerHTML =
    '<div class="stat-pill">🐛 <span class="num">' + (tagCount.fix || 0) + '</span> 修复</div>' +
    '<div class="stat-pill">✨ <span class="num">' + (tagCount.feat || 0) + '</span> 新功能</div>' +
    '<div class="stat-pill">🎨 <span class="num">' + (tagCount.style || 0) + '</span> 样式</div>' +
    '<div class="stat-pill">⚡ <span class="num">' + (tagCount.perf || 0) + '</span> 优化</div>' +
    '<div class="stat-pill">📦 <span class="num">' + ENTRIES.length + '</span> 总计</div>';

  var groups = {};
  ENTRIES.forEach(function (e, i) { (groups[e.date] = groups[e.date] || []).push({ e: e, i: i }); });

  var listHtml = '<div class="ld">全部条目 · ' + ENTRIES.length + ' 条（点击右侧查看中文详情）</div>';
  Object.keys(groups).sort().reverse().forEach(function (date) {
    listHtml += '<div class="day-head">' + date + ' · ' + groups[date].length + ' 条</div>';
    groups[date].forEach(function (g) {
      var p = parseEntry(g.e);
      listHtml += '<div class="li" data-i="' + g.i + '">' +
        '<div class="l-head">' +
          '<span class="e-tag ' + g.e.tag + '">' + p.typeZh + '</span>' +
          '<span class="l-title" title="' + esc(p.titleZh) + '">' + esc(p.titleZh) + '</span>' +
        '</div></div>';
    });
  });
  document.getElementById('listCol').innerHTML = listHtml;

  document.getElementById('listCol').addEventListener('click', function (ev) {
    var li = ev.target && ev.target.closest ? ev.target.closest('.li') : null;
    if (!li) return;
    select(parseInt(li.getAttribute('data-i'), 10));
  });

  select(0);
}

function select(idx) {
  if (idx < 0 || idx >= ENTRIES.length) return;
  curIdx = idx;
  document.querySelectorAll('#listCol .li').forEach(function (el) {
    el.classList.toggle('on', parseInt(el.getAttribute('data-i'), 10) === idx);
  });
  var on = document.querySelector('#listCol .li.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });

  var e = ENTRIES[idx];
  var p = parseEntry(e);
  var html =
    '<span class="d-tag e-tag ' + e.tag + '">' + p.typeZh + '</span>' +
    '<div class="d-title">' + esc(p.titleZh) + '</div>' +
    '<div class="d-date">' + esc(e.date) + (p.scopeZh ? ' · ' + esc(p.scopeZh) : '') + '</div>' +
    '<div class="d-sec">说明</div><div class="d-desc"><ul>' +
      p.lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') +
    '</ul></div>';
  if (p.files.length) {
    html += '<div class="d-sec">涉及数据文件（' + p.files.length + ' 个）</div>' +
      '<div class="d-files">' + p.files.map(function (f) { return '<code>' + esc(f) + '</code>'; }).join('') + '</div>';
  }
  html += '<div class="d-sec">原始记录</div><div class="d-raw">' + esc(p.raw) + '</div>';
  document.getElementById('detailCol').innerHTML = html;
}

fetch('changelog.json?' + Date.now())
  .then(function (r) { return r.json(); })
  .then(function (entries) {
    ENTRIES = Array.isArray(entries) ? entries : [];
    if (!ENTRIES.length) {
      document.getElementById('listCol').innerHTML = '<div class="ld">暂无记录</div>';
      document.getElementById('detailCol').innerHTML = '<div class="d-empty">还没有更新记录</div>';
      return;
    }
    render();
  })
  .catch(function () {
    document.getElementById('listCol').innerHTML = '<div class="ld">加载失败</div>';
    document.getElementById('detailCol').innerHTML = '<div class="d-empty">加载失败，请刷新重试</div>';
  });
</script>
</body>
</html>

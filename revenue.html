<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 卖出复盘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='none' stroke='%2360a5fa' stroke-width='2'/%3E%3Ctext x='20' y='27' font-size='22' text-anchor='middle' fill='%2360a5fa' font-family='Georgia,serif'%3E%CE%B1%3C/text%3E%3C/svg%3E">
<meta name="description" content="AlphaTrack · CS2 卖出复盘：胜率、盈亏比、每笔期望与全部卖出明细。">
<meta property="og:title" content="CS2 卖出复盘">
<meta property="og:description" content="AlphaTrack · CS2 卖出复盘：胜率、盈亏比、每笔期望与全部卖出明细。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#020617">
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--hair:rgba(48,54,61,.6);--text:#d1d5db;--text2:#9ca3af;--text3:#6b7280;--rise:#ef4444;--fall:#22c55e;--blue:#58a6ff;--amber:#fbbf24;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1000px;margin:0 auto;padding:24px 16px 32px}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:12px;color:var(--text3);margin-top:4px;line-height:1.6}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.header .nav a{color:var(--blue);text-decoration:none;font-size:12px;margin-left:12px}
.header .nav a:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .15s ease;user-select:none}
.tab:hover{border-color:rgba(148,163,184,.5);color:var(--text)}
.tab.on{background:rgba(88,166,255,.14);border-color:rgba(88,166,255,.5);color:var(--blue);font-weight:600}

.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hero .big{font-size:34px;font-weight:800;font-family:'DM Mono','JetBrains Mono',ui-monospace,monospace;letter-spacing:-.03em;line-height:1.1}
.hero .big.rise{color:var(--rise)}.hero .big.fall{color:var(--fall)}
.hero .cap{font-size:12px;color:var(--text3)}
.wr{display:flex;align-items:center;gap:10px;margin-left:auto}
.wr .wv{font-size:24px;font-weight:800;font-family:'DM Mono',monospace}
.wr .wv.hi{color:var(--fall)}.wr .wv.lo{color:var(--rise)}.wr .wv.mid{color:var(--amber)}
.wring{width:52px;height:52px;transform:rotate(-90deg)}
.wring .bgc{fill:none;stroke:var(--surface2);stroke-width:6}
.wring .fgc{fill:none;stroke-width:6;stroke-linecap:round}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.m{background:var(--surface2);border:1px solid var(--hair);border-radius:8px;padding:9px 12px}
.m .k{font-size:11px;color:var(--text3);margin-bottom:3px}
.m .v{font-size:15px;font-weight:750;font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.m .s{font-size:11px;color:var(--text3);margin-top:2px}
.m .v.rise{color:var(--rise)}.m .v.fall{color:var(--fall)}.m .v.blue{color:var(--blue)}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart-box{background:var(--surface2);border:1px solid var(--hair);border-radius:8px;padding:10px}
.chart-box .ct{font-size:11px;color:var(--text3);margin-bottom:6px}
.chart-svg{width:100%;height:auto;display:block}
.chart-line{fill:none;stroke-width:2;stroke-linejoin:round}
.zero-line{stroke:rgba(255,255,255,.1);stroke-width:1;stroke-dasharray:4,3}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
th{padding:8px 10px;color:var(--text3);font-size:11px;letter-spacing:.4px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;user-select:none}
th.sortable{cursor:pointer;transition:color .15s ease}
th.sortable:hover{color:var(--text)}
th .arw{opacity:.45;font-size:10px;margin-left:2px}
th.act{color:var(--blue)}th.act .arw{opacity:1}
td{padding:8px 10px;border-bottom:1px solid var(--hair);color:var(--text2)}
tbody tr{transition:background .15s ease}
tbody tr:hover{background:rgba(88,166,255,.05)}
td.num{font-family:'DM Mono',monospace;white-space:nowrap;font-variant-numeric:tabular-nums}
td.rise{color:var(--rise);font-weight:700}td.fall{color:var(--fall);font-weight:700}
td.name{color:var(--text);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkt-tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;margin-left:6px;background:rgba(148,163,184,.12);color:var(--text3)}
.search{width:100%;padding:6px 10px;margin-bottom:10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-family:inherit;outline:none}
.search:focus{border-color:rgba(88,166,255,.6)}
.search::placeholder{color:var(--text3)}
.toolbar2{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s ease}
.btn:hover{border-color:rgba(148,163,184,.5);color:var(--text)}

.empty{padding:40px 20px;text-align:center}
.empty .ico{font-size:26px;opacity:.5;margin-bottom:8px}
.empty .t{font-size:13px;color:var(--text2);font-weight:600;margin-bottom:6px}
.empty .d{font-size:12px;color:var(--text3);line-height:1.7;max-width:520px;margin:0 auto}
.empty .d code{background:var(--surface2);border:1px solid var(--hair);border-radius:4px;padding:1px 5px;font-size:11px;color:var(--text2)}
.more{display:block;width:100%;margin-top:10px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit}
.more:hover{border-color:rgba(148,163,184,.5);color:var(--text)}
.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:640px){
  .container{padding:18px 12px 28px}
  .charts{grid-template-columns:1fr}
  .card{padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hero .big{font-size:28px}
  table{min-width:520px}
  .wr{margin-left:0}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1>卖出复盘</h1><div class="sub" id="revDate">加载中…</div></div>
    <div class="nav"><a href="/">← 返回看板</a></div>
  </div>

  <div class="card">
    <div class="tabs" id="revTabs">
      <button class="tab on" data-d="7">近7天</button>
      <button class="tab" data-d="30">近30天</button>
      <button class="tab" data-d="0">全部</button>
    </div>
    <div id="revBody"><div class="empty"><span class="loading"></span></div></div>
  </div>
</div>
<script>
/* ══════════════════════════════════════════════════════════════════
   卖出复盘 —— 2026-09-25 完全重写
   数据契约（与 index.html 卖出流程一致，旧记录兼容）：
     { n:名称(中文), w:磨损码, c:买入成本, p:卖出价, pnl:利润, pnlPct:利润率, date:'2026/9/5 14:00:00' }
   来源：localStorage cs2_sold_items + Worker /api/sold（跨设备同步）
   相比旧版新增：胜率环 / 盈亏比 / 每笔期望 / 最大单笔 / 品类盈亏 /
                每日盈亏柱状图 / 可排序单品明细 / CSV 导出
   原则：只统计真实记录；没有买入时间就不编造"持仓时长"。
   ══════════════════════════════════════════════════════════════════ */

var WORKER_BASE = 'https://cs2wyx.asia';
var state = { raw: [], filterDays: 7, q: '', sort: { key: 'date', dir: -1 }, shown: 30, cloudCount: -1 };

var WEAR_ZH = { FN: '崭新出厂', MW: '略有磨损', FT: '久经沙场', WW: '战地风云', BS: '战痕累累' };

/* 品类推断（与 index.html inferCatFromName 同口径的精简版） */
var CAT = [
  ['sticker', /印花|胶囊|武器箱|涂鸦|布章|挂件|Charm|Capsule|Case$/i],
  ['music',   /^音乐盒|Music Kit/],
  ['knives',  /^★[\s\S]*?(刀|匕首|短剑|刺刀|爪刀|蝴蝶刀|折叠刀|猎刀|穿肠刀)/],
  ['gloves',  /手套/]
];
var CAT_ZH = { weapon: '武器', sticker: '印花/箱', knives: '匕首', gloves: '手套', music: '音乐盒', other: '其他' };
function catOf(name) {
  var s = String(name || '');
  for (var i = 0; i < CAT.length; i++) if (CAT[i][1].test(s)) return CAT[i][0];
  var head = s.split('|')[0].trim();
  if (/^(AK-47|M4A1|M4A4|AWP|AUG|SG ?553|FAMAS|法玛斯|加利尔|Galil|G3SG1|SCAR-20|SSG ?08|M249|内格夫|Negev|MP9|MAC-10|MP7|MP5|UMP-45|P90|PP-野牛|PP-Bizon|P2000|USP|USP消音版|格洛克|Glock|P250|Five-SeveN|Tec-9|CZ75|R8|沙漠之鹰|Desert ?Eagle|双持贝瑞塔|新星|Nova|XM1014|MAG-7|截短霰弹枪|Sawed-Off)/i.test(head)) return 'weapon';
  if (/^(AK-47|M4A1|M4A4|AWP|AUG|SG ?553|FAMAS|法玛斯|加利尔|Galil|G3SG1|SCAR-20|SSG ?08|M249|内格夫|Negev|MP9|MAC-10|MP7|MP5|UMP-45|P90|PP-野牛|PP-Bizon|P2000|USP|USP消音版|格洛克|Glock|P250|Five-SeveN|Tec-9|CZ75|R8|沙漠之鹰|Desert ?Eagle|双持贝瑞塔|新星|Nova|XM1014|MAG-7|截短霰弹枪|Sawed-Off)/i.test(s)) return 'weapon';
  return 'other';
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function money(v) { return (v >= 0 ? '+' : '−') + '¥' + Math.abs(v).toFixed(2); }
/* '2026/9/5 14:00:00' / ISO → 规范化（旧记录无前导零，直接字符串排序会乱） */
function normDate(s) {
  var d = new Date(s);
  if (isNaN(d.getTime())) return { key: '', disp: String(s || '') };
  function p(n) { return n < 10 ? '0' + n : '' + n; }
  return {
    key: d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()),
    disp: d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes())
  };
}

function loadLocal() {
  try { return JSON.parse(localStorage.getItem('cs2_sold_items') || '[]'); } catch (e) { return []; }
}

function loadRev() {
  state.raw = loadLocal();
  render();
  /* 云端同步：远端条数更多则采用（Worker 无删除接口，只增不删） */
  fetch(WORKER_BASE + '/api/sold').then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
    if (!Array.isArray(data)) return;
    state.cloudCount = data.length;
    if (data.length > state.raw.length) {
      state.raw = data;
      try { localStorage.setItem('cs2_sold_items', JSON.stringify(data)); } catch (e) {}
    }
    render();
  }).catch(function () {});
}

/* ── 统计 ── */
function filtered() {
  var q = state.q.trim().toLowerCase();
  var now = Date.now();
  return state.raw.filter(function (s) {
    if (state.filterDays > 0 && now - new Date(s.date).getTime() > state.filterDays * 86400000) return false;
    if (q && String(s.n || '').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function stats(rows) {
  var win = 0, lose = 0, sumPnl = 0, sumSell = 0, sumCost = 0;
  var maxWin = null, maxLose = null;
  var byCat = {};
  rows.forEach(function (s) {
    var pnl = Number(s.pnl) || 0;
    sumPnl += pnl; sumSell += Number(s.p) || 0; sumCost += Number(s.c) || 0;
    if (pnl > 0) { win++; if (!maxWin || pnl > Number(maxWin.pnl)) maxWin = s; }
    else if (pnl < 0) { lose++; if (!maxLose || pnl < Number(maxLose.pnl)) maxLose = s; }
    var c = catOf(s.n);
    if (!byCat[c]) byCat[c] = { n: 0, pnl: 0, win: 0 };
    byCat[c].n++; byCat[c].pnl += pnl; if (pnl > 0) byCat[c].win++;
  });
  var total = rows.length;
  var wr = total ? win / total : 0;
  var winRows = rows.filter(function (s) { return (Number(s.pnl) || 0) > 0; });
  var loseRows = rows.filter(function (s) { return (Number(s.pnl) || 0) < 0; });
  var avgWin = win ? winRows.reduce(function (a, s) { return a + Number(s.pnl); }, 0) / win : 0;
  var avgLose = lose ? Math.abs(loseRows.reduce(function (a, s) { return a + Number(s.pnl); }, 0) / lose) : 0;
  var pl = avgLose > 0 ? avgWin / avgLose : null;
  var ev = total ? (wr * avgWin - (1 - wr) * avgLose) : 0;
  return {
    total: total, win: win, lose: lose, wr: wr,
    sumPnl: sumPnl, sumSell: sumSell, sumCost: sumCost,
    avgWin: avgWin, avgLose: avgLose, pl: pl, ev: ev,
    maxWin: maxWin, maxLose: maxLose, byCat: byCat
  };
}

/* ── 渲染 ── */
function render() {
  var rows = filtered();
  var st = stats(rows);
  var src = '本地 ' + state.raw.length + ' 条' +
    (state.cloudCount >= 0 ? ' · 云端 ' + state.cloudCount + ' 条' : '');
  document.getElementById('revDate').textContent =
    (state.filterDays ? '近 ' + state.filterDays + ' 天' : '全部') + '：' + rows.length + ' 笔 · 记录 ' + src;

  var body = document.getElementById('revBody');
  if (!state.raw.length) {
    body.innerHTML = '<div class="empty"><div class="ico">◍</div><div class="t">还没有卖出记录</div>' +
      '<div class="d">在持仓面板点 <code>卖出此件</code> 并确认后，这一笔会自动记到这里：' +
      '买入成本、卖出价、盈亏都会留下，随时回来复盘。</div></div>';
    return;
  }
  if (!rows.length) {
    body.innerHTML = '<div class="empty"><div class="ico">◍</div><div class="t">该时间段没有卖出记录</div>' +
      '<div class="d">换个时间范围，或切到「全部」。</div></div>';
    return;
  }

  var pc = st.sumPnl >= 0 ? 'rise' : 'fall';
  var wrCls = st.wr >= 0.55 ? 'hi' : (st.wr >= 0.4 ? 'mid' : 'lo');
  var C = 2 * Math.PI * 22;
  var dash = (st.wr * C).toFixed(1);
  var wrColor = wrCls === 'hi' ? 'var(--fall)' : (wrCls === 'mid' ? 'var(--amber)' : 'var(--rise)');
  var hero =
    '<div class="hero">' +
      '<div><div class="cap">已实现利润（' + st.total + ' 笔）</div>' +
      '<div class="big ' + pc + '">' + money(st.sumPnl) + '</div>' +
      '<div class="cap">投入 ¥' + st.sumCost.toFixed(0) + ' → 回款 ¥' + st.sumSell.toFixed(0) + '</div></div>' +
      '<div class="wr"><svg class="wring" viewBox="0 0 52 52">' +
        '<circle class="bgc" cx="26" cy="26" r="22"/>' +
        '<circle class="fgc" cx="26" cy="26" r="22" stroke="' + wrColor + '" stroke-dasharray="' + dash + ' ' + (C - dash).toFixed(1) + '"/>' +
      '</svg><div><div class="cap">胜率</div><div class="wv ' + wrCls + '">' + (st.wr * 100).toFixed(0) + '%</div>' +
      '<div class="cap">' + st.win + ' 胜 ' + st.lose + ' 负</div></div></div>' +
    '</div>';

  var plTxt = st.pl === null ? '—' : st.pl.toFixed(2);
  var plCls = st.pl === null ? '' : (st.pl >= 1 ? 'rise' : 'fall');
  var mw = st.maxWin ? '<span class="m"><div class="k">最大单笔盈利</div><div class="v rise">' + money(Number(st.maxWin.pnl)) +
    '</div><div class="s">' + esc(String(st.maxWin.n).slice(0, 18)) + '</div></span>' : '';
  var ml = st.maxLose ? '<span class="m"><div class="k">最大单笔亏损</div><div class="v fall">' + money(Number(st.maxLose.pnl)) +
    '</div><div class="s">' + esc(String(st.maxLose.n).slice(0, 18)) + '</div></span>' : '';
  var metrics = '<div class="metrics">' +
    '<span class="m"><div class="k">平均每笔</div><div class="v ' + (st.sumPnl >= 0 ? 'rise' : 'fall') + '">' +
      money(st.sumPnl / st.total) + '</div></span>' +
    '<span class="m"><div class="k">平均盈利</div><div class="v rise">' + (st.win ? '+¥' + st.avgWin.toFixed(2) : '—') + '</div></span>' +
    '<span class="m"><div class="k">平均亏损</div><div class="v fall">' + (st.lose ? '−¥' + st.avgLose.toFixed(2) : '—') + '</div></span>' +
    '<span class="m"><div class="k">盈亏比</div><div class="v ' + plCls + '">' + plTxt +
      '</div><div class="s">' + (st.pl !== null ? (st.pl >= 1 ? '赚的比亏的大' : '亏的比赚的大') : '暂无亏损') + '</div></span>' +
    '<span class="m"><div class="k">每笔期望</div><div class="v ' + (st.ev >= 0 ? 'rise' : 'fall') + '">' + money(st.ev) +
      '</div><div class="s">按当前胜率与盈亏比</div></span>' +
    mw + ml +
  '</div>';

  var byDay = {};
  rows.forEach(function (s) {
    var k = normDate(s.date).key;
    if (!k) return;
    if (!byDay[k]) byDay[k] = { pnl: 0, n: 0 };
    byDay[k].pnl += Number(s.pnl) || 0; byDay[k].n++;
  });
  var days = Object.keys(byDay).sort();
  var cum = 0;
  var series = days.map(function (d) { cum += byDay[d].pnl; return { d: d, pnl: byDay[d].pnl, n: byDay[d].n, cum: cum }; });

  var catRows = Object.keys(st.byCat).map(function (k) { return { k: k, d: st.byCat[k] }; })
    .sort(function (a, b) { return b.d.pnl - a.d.pnl; });
  var catHtml = '<table><thead><tr><th>品类</th><th style="text-align:right">笔数</th>' +
    '<th style="text-align:right">胜率</th><th style="text-align:right">盈亏</th></tr></thead><tbody>' +
    catRows.map(function (r) {
      var c = r.d.pnl >= 0 ? 'rise' : 'fall';
      return '<tr><td>' + esc(CAT_ZH[r.k] || r.k) + '</td>' +
        '<td class="num" style="text-align:right">' + r.d.n + '</td>' +
        '<td class="num" style="text-align:right">' + (r.d.n ? Math.round(r.d.win / r.d.n * 100) : 0) + '%</td>' +
        '<td class="num ' + c + '" style="text-align:right">' + money(r.d.pnl) + '</td></tr>';
    }).join('') + '</tbody></table>';

  body.innerHTML =
    hero + metrics +
    '<div class="charts" style="margin-top:12px">' +
      '<div class="chart-box"><div class="ct">累计利润（按日）</div>' + lineChart(series) + '</div>' +
      '<div class="chart-box"><div class="ct">每日盈亏（悬停看当日合计与笔数）</div>' + barChart(series) + '</div>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">' +
      '<div class="chart-box"><div class="ct">品类盈亏</div>' + catHtml + '</div>' +
      '<div class="chart-box"><div class="ct">口径说明</div>' +
        '<div style="font-size:12px;color:var(--text3);line-height:1.9">' +
        '· 记录在持仓面板点「卖出此件」时生成，跨设备由 Worker 同步<br>' +
        '· 盈亏 = 卖出价 − 买入成本（挂牌价口径，非实际到账）<br>' +
        '· 胜率环：≥55% 绿 / 40~55% 黄 / &lt;40% 红<br>' +
        '· <b>每笔期望</b> = 胜率×平均盈利 − 败率×平均亏损，衡量当前打法长期是否赚钱<br>' +
        '· 旧记录没有买入时间，所以没有「持仓时长」——不编造</div>' +
      '</div>' +
    '</div>' +
    '<div style="margin-top:12px">' +
      '<div class="toolbar2"><input class="search" id="revSearch" placeholder="搜索饰品…" value="' + esc(state.q) + '">' +
      '<button class="btn" id="revCsv">导出 CSV</button><span style="font-size:11px;color:var(--text3)">共 ' + rows.length + ' 笔</span></div>' +
      '<table><thead><tr>' +
        '<th class="sortable" data-sort="date">日期<span class="arw">↕</span></th>' +
        '<th class="sortable" data-sort="n">饰品<span class="arw">↕</span></th>' +
        '<th class="sortable" data-sort="cat">品类<span class="arw">↕</span></th>' +
        '<th class="sortable" data-sort="c">买入<span class="arw">↕</span></th>' +
        '<th class="sortable" data-sort="p">卖出<span class="arw">↕</span></th>' +
        '<th class="sortable" data-sort="pnl">盈亏<span class="arw">↕</span></th>' +
        '<th class="sortable" data-sort="pnlPct">盈亏率<span class="arw">↕</span></th>' +
      '</tr></thead><tbody id="revRows"></tbody></table>' +
      '<button class="more" id="revMore" hidden></button>' +
    '</div>';

  renderTable(rows);

  document.getElementById('revSearch').addEventListener('input', function (e) {
    state.q = e.target.value; state.shown = 30; renderTable(rows);
  });
  document.getElementById('revCsv').addEventListener('click', function () { exportCsv(rows); });
  document.getElementById('revMore').addEventListener('click', function () {
    state.shown += 50; renderTable(rows);
  });
  body.querySelectorAll('th.sortable').forEach(function (th) {
    th.addEventListener('click', function () {
      var k = this.getAttribute('data-sort');
      if (state.sort.key === k) state.sort.dir = -state.sort.dir;
      else { state.sort.key = k; state.sort.dir = -1; }
      body.querySelectorAll('th.sortable').forEach(function (t) {
        t.classList.remove('act'); var a = t.querySelector('.arw'); if (a) a.textContent = '↕';
      });
      this.classList.add('act');
      var arw = this.querySelector('.arw'); if (arw) arw.textContent = state.sort.dir < 0 ? '↓' : '↑';
      renderTable(rows);
    });
  });
  var act = body.querySelector('th[data-sort="' + state.sort.key + '"]');
  if (act) { act.classList.add('act'); var a = act.querySelector('.arw'); if (a) a.textContent = state.sort.dir < 0 ? '↓' : '↑'; }
}

function sortedRows(rows) {
  var s = state.sort, q = state.q.trim().toLowerCase();
  var out = rows.filter(function (r) {
    return !q || String(r.n || '').toLowerCase().indexOf(q) >= 0;
  });
  out.sort(function (a, b) {
    var va, vb;
    if (s.key === 'date') { va = normDate(a.date).key + String(a.date); vb = normDate(b.date).key + String(b.date); return va < vb ? -s.dir : (va > vb ? s.dir : 0); }
    if (s.key === 'n') { va = String(a.n); vb = String(b.n); return va < vb ? -s.dir : (va > vb ? s.dir : 0); }
    if (s.key === 'cat') { va = catOf(a.n); vb = catOf(b.n); return va < vb ? -s.dir : (va > vb ? s.dir : 0); }
    va = Number(a[s.key]) || 0; vb = Number(b[s.key]) || 0;
    return (vb - va) * (s.dir > 0 ? -1 : 1);
  });
  return out;
}

function renderTable(rows) {
  var all = sortedRows(rows);
  var slice = all.slice(0, state.shown);
  var el = document.getElementById('revRows');
  if (!el) return;
  el.innerHTML = slice.map(function (s) {
    var pnl = Number(s.pnl) || 0;
    var pct = Number(s.pnlPct) || 0;
    var cls = pnl > 0 ? 'rise' : (pnl < 0 ? 'fall' : '');
    var nd = normDate(s.date);
    return '<tr>' +
      '<td class="num">' + esc(nd.disp) + '</td>' +
      '<td class="name" title="' + esc(s.n) + '">' + esc(s.n) +
        (s.w && WEAR_ZH[s.w] ? '<span class="mkt-tag">' + WEAR_ZH[s.w] + '</span>' : '') + '</td>' +
      '<td>' + esc(CAT_ZH[catOf(s.n)] || '—') + '</td>' +
      '<td class="num">¥' + (Number(s.c) || 0).toFixed(2) + '</td>' +
      '<td class="num">¥' + (Number(s.p) || 0).toFixed(2) + '</td>' +
      '<td class="num ' + cls + '">' + money(pnl) + '</td>' +
      '<td class="num ' + cls + '">' + (pct > 0 ? '+' : '') + pct.toFixed(1) + '%</td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="7"><div class="empty" style="padding:20px">没有匹配的记录</div></td></tr>';
  var more = document.getElementById('revMore');
  if (more) {
    more.hidden = slice.length >= all.length;
    more.textContent = '显示更多（还有 ' + (all.length - slice.length) + ' 笔）';
  }
}

/* ── 图表 ── */
function lineChart(series) {
  if (series.length < 2) return '<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">数据点不足，攒几天再看</div>';
  var cw = 440, ch = 170, pad = { t: 14, r: 10, b: 24, l: 52 }, pW = cw - pad.l - pad.r, pH = ch - pad.t - pad.b;
  var vals = series.map(function (s) { return s.cum; });
  var mn = Math.min(0, Math.min.apply(null, vals)), mx = Math.max(0, Math.max.apply(null, vals)), rg = mx - mn || 1;
  var yL = '';
  for (var yi = 0; yi <= 3; yi++) {
    var v = mn + rg * yi / 3, yy = pad.t + pH - yi / 3 * pH;
    yL += '<text x="' + (pad.l - 6) + '" y="' + (yy + 3) + '" text-anchor="end" fill="var(--text3)" font-size="9">' + (v >= 0 ? '+' : '−') + '¥' + Math.abs(v).toFixed(0) + '</text>';
  }
  var xL = '', step = Math.max(1, Math.floor(series.length / 5));
  series.forEach(function (s, i) {
    if (i % step === 0 || i === series.length - 1) {
      var x = pad.l + i / (series.length - 1) * pW;
      xL += '<text x="' + x + '" y="' + (ch - 6) + '" text-anchor="middle" fill="var(--text3)" font-size="9">' + s.d.slice(5) + '</text>';
    }
  });
  var path = '', area = '';
  series.forEach(function (s, i) {
    var x = pad.l + i / (series.length - 1) * pW;
    var y = pad.t + pH - (s.cum - mn) / rg * pH;
    path += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
    if (i === series.length - 1) area = path + 'L' + x.toFixed(1) + ',' + (pad.t + pH) + 'L' + pad.l + ',' + (pad.t + pH) + 'Z';
  });
  var zy = pad.t + pH - (0 - mn) / rg * pH;
  var last = series[series.length - 1];
  return '<svg class="chart-svg" viewBox="0 0 ' + cw + ' ' + ch + '">' +
    (mn < 0 && mx > 0 ? '<line x1="' + pad.l + '" y1="' + zy.toFixed(1) + '" x2="' + (cw - pad.r) + '" y2="' + zy.toFixed(1) + '" class="zero-line"/>' : '') +
    yL + xL +
    '<path d="' + area + '" fill="var(--blue)" opacity=".08"/>' +
    '<path d="' + path + '" class="chart-line" stroke="var(--blue)"/>' +
    '<circle cx="' + (pad.l + pW).toFixed(1) + '" cy="' + (pad.t + pH - (last.cum - mn) / rg * pH).toFixed(1) + '" r="3" fill="var(--blue)"/>' +
    '</svg>';
}

function barChart(series) {
  if (!series.length) return '';
  var cw = 440, ch = 170, pad = { t: 14, r: 10, b: 24, l: 52 }, pW = cw - pad.l - pad.r, pH = ch - pad.t - pad.b;
  var mx = Math.max.apply(null, series.map(function (s) { return Math.abs(s.pnl); })) || 1;
  var bw = Math.max(3, pW / series.length * 0.6);
  var bars = '', xL = '', step = Math.max(1, Math.floor(series.length / 5));
  series.forEach(function (s, i) {
    var x = pad.l + (i + 0.5) / series.length * pW;
    var h = Math.abs(s.pnl) / mx * (pH / 2 - 4);
    var y = s.pnl >= 0 ? pad.t + pH / 2 - h : pad.t + pH / 2;
    bars += '<rect x="' + (x - bw / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) +
            '" height="' + Math.max(1, h).toFixed(1) + '" fill="' + (s.pnl >= 0 ? 'var(--rise)' : 'var(--fall)') +
            '" opacity=".75"><title>' + s.d + ' · ' + s.n + ' 笔 · ' + money(s.pnl) + '</title></rect>';
    if (i % step === 0 || i === series.length - 1) {
      xL += '<text x="' + x + '" y="' + (ch - 6) + '" text-anchor="middle" fill="var(--text3)" font-size="9">' + s.d.slice(5) + '</text>';
    }
  });
  var zy = pad.t + pH / 2;
  return '<svg class="chart-svg" viewBox="0 0 ' + cw + ' ' + ch + '">' +
    '<line x1="' + pad.l + '" y1="' + zy + '" x2="' + (cw - pad.r) + '" y2="' + zy + '" class="zero-line"/>' +
    '<text x="' + (pad.l - 6) + '" y="' + (zy - 4) + '" text-anchor="end" fill="var(--text3)" font-size="9">0</text>' +
    bars + xL + '</svg>';
}

function exportCsv(rows) {
  var out = sortedRows(rows);
  var lines = [['日期', '饰品', '磨损', '买入', '卖出', '盈亏', '盈亏率'].join(',')];
  out.forEach(function (s) {
    lines.push(['"' + String(s.date || '') + '"', '"' + String(s.n || '').replace(/"/g, '""') + '"',
      s.w || '', Number(s.c) || 0, Number(s.p) || 0, Number(s.pnl) || 0, Number(s.pnlPct) || 0].join(','));
  });
  var blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cs2_sold_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
}

/* ── 事件 ── */
document.getElementById('revTabs').addEventListener('click', function (e) {
  var btn = e.target && e.target.closest ? e.target.closest('.tab') : null;
  if (!btn) return;
  this.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('on'); });
  btn.classList.add('on');
  state.filterDays = parseInt(btn.getAttribute('data-d'), 10) || 0;
  state.shown = 30;
  render();
});

loadRev();
/* 数据更新后自动重载 */
(function () {
  var last = Date.now();
  setInterval(function () {
    fetch('data_status.json?ts=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var ut = d && d.updated;
        if (ut && new Date(ut).getTime() > last) { last = new Date(ut).getTime(); loadRev(); }
      }).catch(function () {});
  }, 60000);
})();
</script>

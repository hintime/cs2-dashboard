<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 收入统计</title>
<style>
:root{--bg:#0d1117;--surface:rgba(22,27,34,.85);--surface2:rgba(30,36,46,.7);--border:rgba(55,65,81,.4);--text:#d1d5db;--text2:#9ca3af;--text3:#6b7280;--rise:#f87171;--fall:#34d399;--blue:#60a5fa;--amber:#fbbf24;--radius:14px;--shadow:0 2px 16px rgba(0,0,0,.25)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:11px;color:var(--text3);margin-top:3px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:8px}
.header .nav a{color:var(--blue);text-decoration:none;font-size:12px;margin-left:12px}.header .nav a:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:14px;letter-spacing:.3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface2);border-radius:8px;padding:12px 14px;text-align:center}.kpi-l{font-size:10px;color:var(--text3);margin-bottom:4px}
.kpi-v{font-size:20px;font-weight:800;font-family:'DM Mono','JetBrains Mono',monospace}
.kpi-v.rise{color:var(--rise)}.kpi-v.fall{color:var(--fall)}.kpi-v.blue{color:var(--blue)}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:2px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(55,65,81,.08);font-size:12px}
.row:last-child{border-bottom:none}.row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.row .v{min-width:50px;text-align:right;font-weight:600;font-family:'DM Mono',monospace}.empty{text-align:center;padding:24px;color:var(--text3);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{background:var(--surface2);border:1px solid var(--border);color:var(--text3);padding:5px 14px;border-radius:5px;cursor:pointer;font-size:11px;transition:all .15s}
.tab.on{background:var(--glow-blue, rgba(96,165,250,.12));border-color:var(--blue);color:var(--blue);font-weight:600}
.chart-svg{width:100%;height:auto;background:var(--surface2);border-radius:8px;margin-bottom:12px}
.chart-area{opacity:.12}.chart-line{fill:none;stroke-width:2;stroke-linejoin:round}
.zero-line{stroke:rgba(255,255,255,.08);stroke-width:1;stroke-dasharray:4,3}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1>收入统计</h1><div class="sub" id="revDate">加载中...</div></div>
    <div class="nav"><a href="/">← 返回看板</a></div>
  </div>
  <div class="card">
    <div class="tabs" id="revTabs">
      <button class="tab on" data-d="7d">近7天</button>
      <button class="tab" data-d="30d">近30天</button>
      <button class="tab" data-d="all">全部</button>
    </div>
    <div class="kpis" id="revKpis"></div>
    <div id="revChart"></div>
    <div id="revList"></div>
  </div>
</div>
<script>
var WORKER_BASE = 'https://cs2wyx.asia';
var filterDays = 7, revData = [];

function loadRev() {
  try {
    var saved = localStorage.getItem('cs2_sold_items');
    revData = saved ? JSON.parse(saved) : [];
  } catch(e) { revData = []; }
  // Try Worker sync
  fetch(WORKER_BASE + '/api/sold').then(function(r) { return r.ok ? r.json() : []; }).then(function(data) {
    if (data && data.length > 0) { revData = data; localStorage.setItem('cs2_sold_items', JSON.stringify(data)); renderRev(); }
  }).catch(function() {});
  renderRev();
}

function renderRev() {
  var filtered = filterDays === 0 ? revData : revData.filter(function(s) { return Date.now() - new Date(s.date).getTime() < filterDays * 86400000; });
  document.getElementById('revDate').textContent = '共 ' + revData.length + ' 条记录，当前显示 ' + filtered.length + ' 条';
  if (!filtered.length) {
    document.getElementById('revKpis').innerHTML = ''; document.getElementById('revChart').innerHTML = '<div class="empty">暂无卖出记录</div>'; document.getElementById('revList').innerHTML = '';
    return;
  }
  var totalPnl = filtered.reduce(function(s, i) { return s + (i.pnl || 0); }, 0);
  var totalAmt = filtered.reduce(function(s, i) { return s + (i.p || 0); }, 0);
  var totalRev = filtered.reduce(function(s, i) { return s + (i.c || 0); }, 0);
  var kpiCls = totalPnl >= 0 ? 'rise' : 'fall';
  document.getElementById('revKpis').innerHTML =
    '<div class="kpi"><div class="kpi-l">卖出笔数</div><div class="kpi-v blue">' + filtered.length + '</div></div>' +
    '<div class="kpi"><div class="kpi-l">成交金额</div><div class="kpi-v">¥' + totalAmt.toFixed(0) + '</div></div>' +
    '<div class="kpi"><div class="kpi-l">投入本金</div><div class="kpi-v">¥' + totalRev.toFixed(0) + '</div></div>' +
    '<div class="kpi ' + kpiCls + '"><div class="kpi-l">利润</div><div class="kpi-v">' + (totalPnl >= 0 ? '+' : '') + '¥' + totalPnl.toFixed(2) + '</div></div>';

  // Group by date
  var map = {};
  filtered.forEach(function(s) {
    var d = (s.date || '').split(' ')[0]; if (!d) return;
    if (!map[d]) map[d] = {count:0, amt:0, rev:0, pnl:0};
    map[d].count++; map[d].amt += s.p || 0; map[d].rev += s.c || 0; map[d].pnl += s.pnl || 0;
  });
  var days = Object.keys(map).sort();
  var cum = 0;
  var chartData = days.map(function(d) { cum += map[d].pnl; return {date:d, count:map[d].count, amt:map[d].amt, pnl:map[d].pnl, cum:cum}; });

  // SVG chart
  var vals = chartData.map(function(d) { return d.cum; });
  var yMin = Math.min(0, Math.min.apply(null, vals)), yMax = Math.max(0, Math.max.apply(null, vals)), yR = yMax - yMin || 1;
  var cw = 600, ch = 180, pad = {t:20, r:20, b:30, l:60}, pW = cw - pad.l - pad.r, pH = ch - pad.t - pad.b;
  var yL = '';
  for (var yi = 0; yi <= 4; yi++) { var v = yMin + yR * yi / 4; var yy = pad.t + pH - (yi / 4) * pH; yL += '<text x="' + (pad.l - 8) + '" y="' + (yy + 4) + '" text-anchor="end" fill="var(--text3)" font-size="10">' + (v >= 0 ? '+' : '') + '¥' + v.toFixed(0) + '</text>'; }
  var xL = '', xS = Math.max(1, Math.floor(chartData.length / 6));
  chartData.forEach(function(d, i) { if (i % xS === 0 || i === chartData.length - 1) { var x = pad.l + (i / (chartData.length - 1 || 1)) * pW; xL += '<text x="' + x + '" y="' + (ch - 6) + '" text-anchor="middle" fill="var(--text3)" font-size="9">' + d.date.slice(5) + '</text>'; } });
  var lD = ''; chartData.forEach(function(d, i) { var x = pad.l + (i / (chartData.length - 1 || 1)) * pW; var y = pad.t + pH - ((d.cum - yMin) / yR) * pH; lD += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1); });
  var aD = lD + 'L' + (pad.l + pW) + ',' + (pad.t + pH) + 'L' + pad.l + ',' + (pad.t + pH) + 'Z';
  var zY = pad.t + pH - ((0 - yMin) / yR) * pH;
  document.getElementById('revChart').innerHTML =
    '<svg width="100%" height="' + ch + '" viewBox="0 0 ' + cw + ' ' + ch + '" class="chart-svg"><defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--blue)" stop-opacity="0.3"/><stop offset="100%" stop-color="var(--blue)" stop-opacity="0.02"/></linearGradient></defs>' +
    (yMin < 0 && yMax > 0 ? '<line x1="' + pad.l + '" y1="' + zY.toFixed(1) + '" x2="' + (cw - pad.r) + '" y2="' + zY.toFixed(1) + '" class="zero-line"/>' : '') + yL + xL +
    '<path d="' + aD + '" fill="url(#rg)" class="chart-area"/><path d="' + lD + '" class="chart-line" stroke="var(--blue)"/>' +
    chartData.map(function(d, i) { var x = pad.l + (i / (chartData.length - 1 || 1)) * pW; var y = pad.t + pH - ((d.cum - yMin) / yR) * pH; return '<circle cx="' + x + '" cy="' + y + '" r="2.5" fill="' + (d.pnl >= 0 ? 'var(--rise)' : 'var(--fall)') + '" stroke="var(--surface2)" stroke-width="1.5" opacity="0.8"/>'; }).join('') + '</svg>';

  // Detail table
  document.getElementById('revList').innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="padding:6px 8px;color:var(--text3);font-size:10px;text-align:left;border-bottom:1px solid var(--border)">日期</th><th style="padding:6px 8px;color:var(--text3);font-size:10px;text-align:right;border-bottom:1px solid var(--border)">笔数</th><th style="padding:6px 8px;color:var(--text3);font-size:10px;text-align:right;border-bottom:1px solid var(--border)">利润</th><th style="padding:6px 8px;color:var(--text3);font-size:10px;text-align:right;border-bottom:1px solid var(--border)">累计</th></tr></thead><tbody>' +
    chartData.slice().reverse().map(function(d) { var pc = d.pnl >= 0 ? 'rise' : 'fall'; var cc = d.cum >= 0 ? 'rise' : 'fall'; return '<tr><td style="padding:5px 8px;border-bottom:1px solid rgba(55,65,81,.08)">' + d.date + '</td><td style="padding:5px 8px;text-align:right;border-bottom:1px solid rgba(55,65,81,.08)">' + d.count + '</td><td style="padding:5px 8px;text-align:right;border-bottom:1px solid rgba(55,65,81,.08);color:var(--' + pc + ');font-weight:600">' + (d.pnl >= 0 ? '+' : '') + '¥' + d.pnl.toFixed(2) + '</td><td style="padding:5px 8px;text-align:right;border-bottom:1px solid rgba(55,65,81,.08);color:var(--' + cc + ');font-weight:600">' + (d.cum >= 0 ? '+' : '') + '¥' + d.cum.toFixed(2) + '</td></tr>'; }).join('') + '</tbody></table>';
}

// Tab handlers
document.getElementById('revTabs').addEventListener('click', function(e) {
  var btn = e.target.closest('.tab'); if (!btn) return;
  document.querySelectorAll('#revTabs .tab').forEach(function(t) { t.classList.remove('on'); });
  btn.classList.add('on');
  filterDays = btn.dataset.d === 'all' ? 0 : parseInt(btn.dataset.d);
  renderRev();
});

loadRev();
(function(){var _l=Date.now();setInterval(function(){fetch('market.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){var ut=d.update_time||d.alerts_updated||'';if(ut&&new Date(ut).getTime()>_l){_l=new Date(ut).getTime();loadRev();}}).catch(function(){})},60000)})();
</script>
</body>
</html>

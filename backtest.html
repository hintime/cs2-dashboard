<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 持仓回测</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='none' stroke='%2360a5fa' stroke-width='2'/%3E%3Ctext x='20' y='27' font-size='22' text-anchor='middle' fill='%2360a5fa' font-family='Georgia,serif'%3E%CE%B1%3C/text%3E%3C/svg%3E">
<meta name="description" content="AlphaTrack · CS2 持仓回测：组合市值曲线、最大回撤、单品贡献分析。">
<meta property="og:title" content="CS2 持仓回测">
<meta property="og:description" content="AlphaTrack · CS2 持仓回测：组合市值曲线、最大回撤、单品贡献分析。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#020617">
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--hair:rgba(48,54,61,.6);--text:#d1d5db;--text2:#9ca3af;--text3:#6b7280;--rise:#ef4444;--fall:#22c55e;--blue:#58a6ff;--amber:#fbbf24;--purple:#a855f7;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1000px;margin:0 auto;padding:24px 16px 32px}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:12px;color:var(--text3);margin-top:4px;line-height:1.6}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.header .nav a{color:var(--blue);text-decoration:none;font-size:12px;margin-left:12px}
.header .nav a:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px}
.card h2{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:12px;letter-spacing:.3px}
.empty{padding:40px 20px;text-align:center}
.empty .ico{font-size:26px;opacity:.5;margin-bottom:8px}
.empty .t{font-size:13px;color:var(--text2);font-weight:600;margin-bottom:6px}
.empty .d{font-size:12px;color:var(--text3);line-height:1.7;max-width:520px;margin:0 auto}
.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hero .big{font-size:30px;font-weight:800;font-family:'DM Mono','JetBrains Mono',ui-monospace,monospace;letter-spacing:-.03em;line-height:1.1}
.hero .big.rise{color:var(--rise)}.hero .big.fall{color:var(--fall)}
.hero .cap{font-size:12px;color:var(--text3)}
.hero .sub2{font-size:12px;color:var(--text2);margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.m{background:var(--surface2);border:1px solid var(--hair);border-radius:8px;padding:9px 12px}
.m .k{font-size:11px;color:var(--text3);margin-bottom:3px}
.m .v{font-size:15px;font-weight:750;font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
.m .s{font-size:11px;color:var(--text3);margin-top:2px}
.m .v.rise{color:var(--rise)}.m .v.fall{color:var(--fall)}.m .v.blue{color:var(--blue)}.m .v.amber{color:var(--amber)}

.bt-chart-wrap{width:100%}
.bt-chart-svg{width:100%;height:auto;background:var(--surface2);border:1px solid var(--hair);border-radius:8px;cursor:crosshair}
.bt-tip{position:absolute;top:8px;transform:translateX(-50%);background:rgba(13,17,23,.92);border:1px solid var(--border);
  border-radius:6px;padding:5px 9px;font-size:11px;color:var(--text);white-space:nowrap;pointer-events:none;
  font-family:'DM Mono',monospace;display:none;z-index:5}
.bt-tip b{color:var(--blue)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--text3);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px;border-radius:1px}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
th{padding:8px 10px;color:var(--text3);font-size:11px;letter-spacing:.4px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;user-select:none}
th.sortable{cursor:pointer;transition:color .15s ease}
th.sortable:hover{color:var(--text)}
th .arw{opacity:.45;font-size:10px;margin-left:2px}
th.act{color:var(--blue)}th.act .arw{opacity:1}
td{padding:8px 10px;border-bottom:1px solid var(--hair);color:var(--text2)}
tbody tr{transition:background .15s ease}
tbody tr:hover{background:rgba(88,166,255,.05)}
td.num{font-family:'DM Mono',monospace;white-space:nowrap;font-variant-numeric:tabular-nums}
td.rise{color:var(--rise);font-weight:700}td.fall{color:var(--fall);font-weight:700}
td.name{color:var(--text);max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-cell{position:relative;min-width:90px}
.bar-cell .bar{position:absolute;right:0;top:50%;transform:translateY(-50%);height:8px;border-radius:2px;opacity:.55}
.bar-cell .bv{position:relative;z-index:1}
.contrib-bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}
.contrib-bar i{display:block;height:100%;border-radius:3px}

@media(max-width:640px){
  .container{padding:18px 12px 28px}
  .card{padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:560px}
  .hero .big{font-size:26px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1>持仓回测</h1><div class="sub" id="btInfo">加载中…</div></div>
    <div class="nav"><a href="/">← 返回看板</a></div>
  </div>
  <div class="card">
    <div id="backtestContent"><div class="empty"><span class="loading"></span></div></div>
  </div>
</div>

<script src="ai-badge.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   持仓回测 —— 2026-09-25 完全重写
   修掉的旧版 bug：
     ① 组合市值直接把各件「单价」相加，没乘 qty（法玛斯 qty=2 只算 1 件）
     ② price_summary 补数据时把 {prices,days} 对象直接塞进 price_history，
        后续按 entry.date/entry.price 读全是 undefined → 那些饰品实际没进曲线
     ③ 不同饰品历史长度不同时，早期日期只有部分饰品计入 → 市值曲线因
        "样本进出"跳变。现在：按日期对齐 + 前值填充，每件从其首个有价日纳入。
   新增：回撤水下阴影、市值悬停 tooltip、单品贡献表（可排序，含贡献占比）。
   数据源：holdings.json 的 price_history（[{date,price}]，真实采集约 60 天）。
   ══════════════════════════════════════════════════════════════════ */

var WORKER_BASE = 'https://cs2wyx.asia';
var state = { items: [], series: [], sort: { key: 'pnl', dir: -1 } };

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function money(v) { return (v >= 0 ? '+' : '−') + '¥' + Math.abs(v).toFixed(2); }

/* price_summary 的 {prices,days} → [{date,price}]；已是数组则原样 */
function normalizeHistory(ph) {
  if (Array.isArray(ph) && ph.length && ph[0] && typeof ph[0] === 'object' && 'price' in ph[0]) return ph;
  if (ph && Array.isArray(ph.prices) && Array.isArray(ph.days)) {
    var out = [];
    for (var i = 0; i < ph.prices.length; i++) {
      var v = Number(ph.prices[i]);
      if (v > 0 && ph.days[i]) out.push({ date: ph.days[i], price: v });
    }
    return out;
  }
  return [];
}

function loadBacktest() {
  var t0 = Math.floor(Date.now() / 900000);
  Promise.all([
    fetch('holdings.json?v=' + t0).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
    fetch('price_summary.json?v=' + t0).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
  ]).then(function (res) {
    var hr = res[0], ps = res[1] || {};
    if (!hr || !Array.isArray(hr.items) || !hr.items.length) {
      document.getElementById('backtestContent').innerHTML =
        '<div class="empty"><div class="ico">◍</div><div class="t">暂无持仓数据</div>' +
        '<div class="d">持仓面板有数据后，这里会画出组合市值曲线与回撤。</div></div>';
      document.getElementById('btInfo').textContent = '无数据';
      return;
    }
    var items = [];
    hr.items.forEach(function (it) {
      var ph = normalizeHistory(it.price_history);
      if (!ph.length && it.market_hash && ps[it.market_hash]) ph = normalizeHistory(ps[it.market_hash]);
      if (!ph.length && it.name && ps[it.name]) ph = normalizeHistory(ps[it.name]);
      if (!ph.length) return;
      var q = it.qty || 1;
      items.push({
        n: it.name || it.n || '', q: q,
        cUnit: (Number(it.cost) || 0) / q,
        p: Number(it.price) || 0,
        hist: ph.map(function (e) { return { d: String(e.date || '').slice(0, 10), v: Number(e.price) || 0 }; })
                .filter(function (e) { return e.d && e.v > 0; })
      });
    });
    if (!items.length) {
      document.getElementById('btInfo').textContent = '0 件可分析';
      document.getElementById('backtestContent').innerHTML =
        '<div class="empty"><div class="ico">◍</div><div class="t">没有含价格历史的持仓</div>' +
        '<div class="d">价格历史由采集任务每日记录，积累几天后这里就能画出组合市值曲线。</div></div>';
      return;
    }
    document.getElementById('btInfo').textContent =
      items.length + ' 件持仓 · 价格历史 ' + items[0].hist.length + ' 个交易日';
    build(items);
  }).catch(function (e) {
    document.getElementById('backtestContent').innerHTML =
      '<div class="empty"><div class="ico">⚠</div><div class="t">加载失败</div>' +
      '<div class="d">' + esc((e && e.message) ? e.message : String(e)) + '</div></div>';
  });
}

/* ── 组合时间线：逐日对齐 + 前值填充 ── */
function build(items) {
  items.forEach(function (it) {
    it.hist.sort(function (a, b) { return a.d < b.d ? -1 : 1; });
    it.map = {};
    it.hist.forEach(function (e) { it.map[e.d] = e.v; });
    it.start = it.hist[0].d;
    it.cost = it.cUnit * it.q;
  });

  var allDates = {};
  items.forEach(function (it) { it.hist.forEach(function (e) { allDates[e.d] = 1; }); });
  var dates = Object.keys(allDates).sort();
  if (dates.length < 2) {
    document.getElementById('backtestContent').innerHTML =
      '<div class="empty"><div class="ico">◍</div><div class="t">数据不足</div>' +
      '<div class="d">需要至少 2 个交易日的价格历史。</div></div>';
    return;
  }

  var series = [], lastVal = {}, peak = 0, maxDD = 0, ddSeries = [];
  var dailyRet = [];
  var totalCost = 0;
  items.forEach(function (it) { totalCost += it.cost; });

  dates.forEach(function (d) {
    var value = 0, cost = 0, covered = 0;
    items.forEach(function (it) {
      if (it.start > d) return;                    // 该饰品此日还没历史 → 未纳入
      if (it.map[d] !== undefined) lastVal[it.n + it.start] = it.map[d];   // 前值填充
      var v = lastVal[it.n + it.start];
      if (v === undefined) return;
      value += v * it.q;
      cost += it.cost;
      covered++;
    });
    var pnl = value - cost;
    if (value > peak) peak = value;
    var dd = peak > 0 ? (peak - value) / peak : 0;
    if (series.length && series[series.length - 1].value > 0) {
      dailyRet.push((value - series[series.length - 1].value) / series[series.length - 1].value);
    }
    if (dd > maxDD) maxDD = dd;
    series.push({ d: d, value: value, cost: cost, pnl: pnl, dd: dd, covered: covered });
  });

  /* 浮动盈亏只在「全覆盖」的日期上才真实——标注覆盖开始日 */
  var fullFrom = null;
  for (var i = 0; i < series.length; i++) {
    if (series[i].covered === items.length) { fullFrom = series[i].d; break; }
  }

  var last = series[series.length - 1];
  var firstFull = fullFrom ? series.filter(function (s) { return s.d >= fullFrom; })[0] : null;
  var retPct = (firstFull && firstFull.cost > 0)
    ? (last.value - firstFull.cost) / firstFull.cost * 100
    : (totalCost > 0 ? (last.value - totalCost) / totalCost * 100 : 0);
  var avgR = dailyRet.length ? dailyRet.reduce(function (a, b) { return a + b; }, 0) / dailyRet.length : 0;
  var vol = dailyRet.length
    ? Math.sqrt(dailyRet.reduce(function (s, r) { return s + (r - avgR) * (r - avgR); }, 0) / dailyRet.length) * 100
    : 0;

  /* 单品贡献（按当前价 vs 成本） */
  items.forEach(function (it) {
    it.pnlNow = (it.p > 0 ? it.p : (it.map[last.d] || 0)) * it.q - it.cost;
    it.pnlPctNow = it.cost > 0 ? it.pnlNow / it.cost * 100 : 0;
  });

  state.items = items;
  state.series = series;
  render(series, items, totalCost, last, retPct, maxDD, vol, dailyRet.length, fullFrom, ddSeries);
}

function render(series, items, totalCost, last, retPct, maxDD, vol, samples, fullFrom) {
  var pc = last.pnl >= 0 ? 'rise' : 'fall';
  var hero =
    '<div class="hero">' +
      '<div><div class="cap">组合当前市值（' + items.length + ' 件）</div>' +
      '<div class="big">¥' + last.value.toFixed(0) + '</div>' +
      '<div class="sub2">成本 ¥' + totalCost.toFixed(0) + ' · 浮动盈亏 <b class="' + pc + '" style="font-family:\'DM Mono\',monospace">' + money(last.pnl) + '</b>' +
      '（' + (retPct >= 0 ? '+' : '') + retPct.toFixed(1) + '%）</div></div>' +
    '</div>';
  var metrics =
    '<div class="metrics">' +
    '<span class="m"><div class="k">最大回撤</div><div class="v fall">−' + (maxDD * 100).toFixed(1) + '%</div>' +
      '<div class="s">峰值到谷底</div></span>' +
    '<span class="m"><div class="k">日波动率</div><div class="v amber">' + vol.toFixed(1) + '%</div>' +
      '<div class="s">' + samples + ' 个交易日样本</div></span>' +
    '<span class="m"><div class="k">市值区间</div><div class="v blue">' +
      '¥' + series[0].value.toFixed(0) + ' → ¥' + last.value.toFixed(0) + '</div>' +
      '<div class="s">' + series[0].d + ' 起</div></span>' +
    '<span class="m"><div class="k">全覆盖自</div><div class="v">' + (fullFrom || '—') + '</div>' +
      '<div class="s">' + (fullFrom ? '此前部分饰品未纳入' : '尚未全覆盖') + '</div></span>' +
    '</div>';

  var chart = comboChart(series, totalCost);
  /* 单品贡献表 */
  var sort = state.sort;
  items.sort(function (a, b) {
    var va, vb;
    if (sort.key === 'n') { va = a.n; vb = b.n; return va < vb ? -sort.dir : (va > vb ? sort.dir : 0); }
    if (sort.key === 'pct') { va = a.pnlPctNow; vb = b.pnlPctNow; }
    else { va = a.pnlNow; vb = b.pnlNow; }
    return (vb - va) * (sort.dir > 0 ? -1 : 1);
  });
  var maxAbs = Math.max.apply(null, items.map(function (it) { return Math.abs(it.pnlNow); })) || 1;
  var rows = items.map(function (it) {
    var cls = it.pnlNow >= 0 ? 'rise' : 'fall';
    var w = Math.abs(it.pnlNow) / maxAbs * 100;
    var col = it.pnlNow >= 0 ? 'var(--rise)' : 'var(--fall)';
    return '<tr>' +
      '<td class="name" title="' + esc(it.n) + '">' + esc(it.n) + (it.q > 1 ? ' <span class="mkt-tag">×' + it.q + '</span>' : '') + '</td>' +
      '<td class="num">¥' + it.cost.toFixed(0) + '</td>' +
      '<td class="num">¥' + (it.p > 0 ? it.p : (it.map && 0) || 0).toFixed(0) + '</td>' +
      '<td class="num ' + cls + '">' + money(it.pnlNow) + '</td>' +
      '<td class="num ' + cls + '">' + (it.pnlPctNow >= 0 ? '+' : '') + it.pnlPctNow.toFixed(1) + '%</td>' +
      '<td class="bar-cell"><div class="contrib-bar"><i style="width:' + w.toFixed(0) + '%;background:' + col + '"></i></div></td>' +
    '</tr>';
  }).join('');

  var container = document.getElementById('backtestContent');
  container.innerHTML =
    hero + metrics +
    '<div class="bt-chart-wrap" style="margin-top:14px;position:relative">' + chart +
      '<div class="legend">' +
        '<span><i style="background:var(--blue)"></i>组合市值</span>' +
        '<span><i style="background:#ff9f43"></i>5 日均线</span>' +
        '<span><i style="background:#a855f7"></i>10 日均线</span>' +
        '<span><i style="background:var(--amber)"></i>总成本</span>' +
        '<span><i style="background:rgba(239,68,68,.35)"></i>回撤（峰值回落部分）</span>' +
        '<span>悬停查看每日明细</span>' +
      '</div>' +
    '</div>' +
    '<div style="margin-top:14px"><h2 style="font-size:13px;color:var(--text2);margin-bottom:8px">单品贡献' +
      '<span style="font-weight:400;color:var(--text3);font-size:11px;margin-left:8px">按当前浮动盈亏，点表头排序</span></h2>' +
      '<table><thead><tr>' +
        '<th class="sortable" data-sort="n">饰品<span class="arw">↕</span></th>' +
        '<th class="sortable" data-sort="cost">成本<span class="arw">↕</span></th>' +
        '<th class="sortable" data-sort="price">现价<span class="arw">↕</span></th>' +
        '<th class="sortable" data-sort="pnl">浮动盈亏<span class="arw">↕</span></th>' +
        '<th class="sortable" data-sort="pct">盈亏率<span class="arw">↕</span></th>' +
        '<th>占比</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';

  container.querySelectorAll('th.sortable').forEach(function (th) {
    th.addEventListener('click', function () {
      var k = this.getAttribute('data-sort');
      if (state.sort.key === k) state.sort.dir = -state.sort.dir;
      else { state.sort.key = k; state.sort.dir = -1; }
      render(series, items, totalCost, last, retPct, maxDD, vol, samples, fullFrom);
    });
  });
  var act = container.querySelector('th[data-sort="' + state.sort.key + '"]');
  if (act) act.classList.add('act');

  /* 悬停 tooltip */
  var svg = container.querySelector('.bt-chart-svg');
  var tip = container.querySelector('.bt-tip');
  if (svg && tip) {
    svg.addEventListener('mousemove', function (e) {
      var rect = svg.getBoundingClientRect();
      var frac = (e.clientX - rect.left) / rect.width;
      var i = Math.max(0, Math.min(series.length - 1, Math.round(frac * (series.length - 1))));
      var s = series[i];
      tip.style.display = 'block';
      tip.style.left = (e.clientX - rect.left) + 'px';
      tip.innerHTML = s.d + ' · 市值 <b>¥' + s.value.toFixed(0) + '</b> · 浮盈 ' + money(s.pnl) +
        '<br>MA5 ' + (ma5[i] !== null && ma5[i] !== undefined ? '¥' + ma5[i].toFixed(0) : '—') +
        ' · MA10 ' + (ma10[i] !== null && ma10[i] !== undefined ? '¥' + ma10[i].toFixed(0) : '—');
    });
    svg.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
  }
}

/* ── 组合市值大图：市值线 + 5/10 日均线 + 成本水平线 + 回撤水下阴影 ──
   均线颜色：MA5 橙、MA10 紫（与成本线 amber 虚线、市值线蓝区分） */
function comboChart(series, totalCost) {
  var cw = 960, ch = 300, pad = { t: 16, r: 14, b: 28, l: 64 }, pW = cw - pad.l - pad.r, pH = ch - pad.t - pad.b;
  /* 均线：MA5 / MA10（不足窗口的天数不画） */
  function ma(series, n) {
    var out = [];
    for (var i = 0; i < series.length; i++) {
      if (i < n - 1) { out.push(null); continue; }
      var s = 0;
      for (var k = i - n + 1; k <= i; k++) s += series[k].value;
      out.push(s / n);
    }
    return out;
  }
  var ma5 = ma(series, 5), ma10 = ma(series, 10);
  var vals = series.map(function (s) { return s.value; })
    .concat(ma5.filter(function (v) { return v !== null; }))
    .concat(ma10.filter(function (v) { return v !== null; }));
  var mn = Math.min.apply(null, vals.concat([totalCost])), mx = Math.max.apply(null, vals.concat([totalCost]));
  var rg = (mx - mn) || 1;
  mn -= rg * 0.06; mx += rg * 0.06; rg = mx - mn;
  var X = function (i) { return pad.l + i / (series.length - 1 || 1) * pW; };
  var Y = function (v) { return pad.t + pH - (v - mn) / rg * pH; };

  var yL = '';
  for (var yi = 0; yi <= 4; yi++) {
    var v = mn + rg * yi / 4;
    yL += '<text x="' + (pad.l - 6) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end" fill="var(--text3)" font-size="9">¥' + v.toFixed(0) + '</text>';
  }
  var xL = '', step = Math.max(1, Math.floor(series.length / 8));
  series.forEach(function (s, i) {
    if (i % step === 0 || i === series.length - 1) {
      xL += '<text x="' + X(i).toFixed(1) + '" y="' + (ch - 6) + '" text-anchor="middle" fill="var(--text3)" font-size="9">' + s.d.slice(5) + '</text>';
    }
  });

  var path = '';
  series.forEach(function (s, i) {
    var x = X(i).toFixed(1), y = Y(s.value).toFixed(1);
    path += (i ? 'L' : 'M') + x + ',' + y;
  });
  /* 回撤区域闭合到峰值线（近似：对每段回撤，用峰值水平线封顶） */
  var ddArea = '';
  var segs = [];
  var cur = null, pk = series[0].value, pkX = X(0);
  series.forEach(function (s, i) {
    if (s.value >= pk) {
      if (cur && cur.pts.length > 1) segs.push(cur);
      cur = null; pk = s.value; pkX = X(i);
    } else {
      if (!cur) cur = { top: Y(pk), pts: ['M' + pkX.toFixed(1) + ',' + Y(pk).toFixed(1)] };
      cur.pts.push('L' + X(i).toFixed(1) + ',' + Y(s.value).toFixed(1));
    }
  });
  if (cur && cur.pts.length > 1) segs.push(cur);
  segs.forEach(function (seg) {
    ddArea += '<path d="' + seg.pts.join(' ') + 'L' + seg.pts[seg.pts.length - 1].split(',')[0] + ',' + seg.top +
              'L' + seg.pts[0].split(',')[1] * 0 + ',' + seg.top + 'Z" fill="var(--rise)" opacity=".12"/>';
  });

  /* 均线 polyline（跳过 null 前段） */
  function maPath(arr) {
    var d = '', started = false;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i] === null) continue;
      d += (started ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(arr[i]).toFixed(1);
      started = true;
    }
    return d;
  }

  var costY = Y(totalCost).toFixed(1);
  var last = series[series.length - 1];
  return '<svg class="bt-chart-svg" viewBox="0 0 ' + cw + ' ' + ch + '" style="height:280px">' +
    '<defs><linearGradient id="btG" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="var(--blue)" stop-opacity=".18"/><stop offset="100%" stop-color="var(--blue)" stop-opacity=".02"/>' +
    '</linearGradient></defs>' +
    yL + xL +
    ddArea +
    '<path d="' + path + 'L' + (pad.l + pW).toFixed(1) + ',' + (pad.t + pH).toFixed(1) + 'L' + pad.l + ',' + (pad.t + pH).toFixed(1) + 'Z" fill="url(#btG)"/>' +
    '<line x1="' + pad.l + '" y1="' + costY + '" x2="' + (cw - pad.r) + '" y2="' + costY + '" stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="6 4" opacity=".85"/>' +
    '<path d="' + maPath(ma10) + '" fill="none" stroke="var(--purple,#a855f7)" stroke-width="1.5" opacity=".9"/>' +
    '<path d="' + maPath(ma5) + '" fill="none" stroke="#ff9f43" stroke-width="1.5" opacity=".9"/>' +
    '<path d="' + path + '" class="bt-chart-line" stroke="var(--blue)"/>' +
    '<circle cx="' + X(series.length - 1).toFixed(1) + '" cy="' + Y(last.value).toFixed(1) + '" r="3.5" fill="var(--blue)"/>' +
    '</svg>' +
    '<div class="bt-tip"></div>';
}

loadBacktest();

/* 数据更新后自动重载 */
(function () {
  var last = Date.now();
  setInterval(function () {
    fetch('data_status.json?ts=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var ut = d && d.updated;
        if (ut && new Date(ut).getTime() > last) { last = new Date(ut).getTime(); loadBacktest(); }
      }).catch(function () {});
  }, 60000);
})();
</script>
</body>
</html>

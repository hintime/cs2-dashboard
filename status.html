<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 数据状态</title>
<style>
:root{--bg:#0d1117;--surface:rgba(22,27,34,.85);--surface2:rgba(30,36,46,.7);--border:rgba(55,65,81,.4);--text:#d1d5db;--text2:#9ca3af;--text3:#6b7280;--rise:#f87171;--fall:#34d399;--blue:#60a5fa;--amber:#fbbf24;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:11px;color:var(--text3);margin-top:3px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:8px}
.header .nav a{color:var(--blue);text-decoration:none;font-size:12px;margin-left:12px}
.header .nav a:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:0 2px 16px rgba(0,0,0,.25)}
.card h2{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:14px;letter-spacing:.3px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(55,65,81,.08);font-size:12px}
.row:last-child{border-bottom:none}
.row .label{color:var(--text2);min-width:140px}
.row .value{color:var(--text);font-weight:600;text-align:right;font-family:'DM Mono','JetBrains Mono',monospace}
.row .value.stale{color:var(--amber)}
.row .value.fresh{color:var(--fall)}
.row .value.old{color:var(--rise)}
.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:30px;color:var(--text3);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px}
.badge-ok{background:rgba(52,211,153,.15);color:var(--fall)}
.badge-warn{background:rgba(251,191,36,.15);color:var(--amber)}
.badge-old{background:rgba(248,113,113,.15);color:var(--rise)}
@media(max-width:640px){.container{padding:18px 12px 28px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1>📡 数据状态</h1><div class="sub" id="statusNow">检查中...</div></div>
    <div class="nav"><a href="/">← 返回看板</a></div>
  </div>
  <div class="card">
    <h2>⏱️ 文件更新时间</h2>
    <div id="fileTimes"></div>
  </div>
  <div class="card">
    <h2>📅 数据积累时间线</h2>
    <div id="timeline"></div>
  </div>
  <div class="card">
    <h2>📊 数据量概览</h2>
    <div id="dataVolume"></div>
  </div>
</div>
<script>
function loadStatus() {
  var t0 = Date.now();

  var dataFetches = {
    market:     fetch('market.json?v=' + t0).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    holdings:   fetch('holdings.json?v=' + t0).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    ecoTracked: fetch('eco_tracked.json?v=' + t0).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    buffHistory:fetch('buff_history.json?v=' + t0).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    dataStatus: fetch('data_status.json?v=' + t0).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    marketScan: fetch('market_scan.json?v=' + t0).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    dailyReport:fetch('daily_report.json?v=' + t0).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    news:       fetch('news.json?v=' + t0).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
  };

  var keys = Object.keys(dataFetches);
  var labels = {
    market:'市场数据', holdings:'持仓数据', ecoTracked:'追踪数据', buffHistory:'BUFF历史',
    priceHistory:'价格历史', marketScan:'市场扫描', dailyReport:'日报', news:'资讯'
  };

  var values = Object.values(dataFetches);
  Promise.all(values).then(function(results) {
    var data = {};
    keys.forEach(function(k, i) { data[k] = results[i]; });

    document.getElementById('statusNow').textContent = '检查时间: ' + new Date().toLocaleString('zh-CN');

    var now = new Date();
    var html = '';
    keys.forEach(function(k) {
      var d = data[k];
      var timeStr = '--';
      var cls = 'old';
      var badge = '<span class="badge badge-old">缺失</span>';

      if (d) {
        var ut = d.update_time || d.updated || d.date || '';
        if (Array.isArray(d) && d.length > 0) {
          // eco_tracked is array - use first item's timestamp or just show count
          var first = d[0];
          if (first && first._updated) ut = first._updated;
        }
        if (ut) {
          var dt = new Date(ut);
          if (!isNaN(dt.getTime())) {
            var diffMin = Math.floor((now - dt) / 60000);
            timeStr = dt.toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
            if (diffMin < 60) { cls = 'fresh'; badge = '<span class="badge badge-ok">' + diffMin + '分钟前</span>'; }
            else if (diffMin < 180) { cls = 'stale'; badge = '<span class="badge badge-warn">' + Math.floor(diffMin/60) + '小时前</span>'; }
            else { cls = 'old'; badge = '<span class="badge badge-old">' + Math.floor(diffMin/60) + '小时前</span>'; }
          }
        } else {
          // No update_time - data exists but no timestamp
          badge = '<span class="badge badge-ok">存在</span>';
          cls = 'fresh';
        }
      }
      html += '<div class="row"><span class="label">' + (labels[k]||k) + '</span><span class="value ' + cls + '">' + timeStr + badge + '</span></div>';
    });
    document.getElementById('fileTimes').innerHTML = html;

    // 数据积累时间线
    var tl = '';
    if (data.buffHistory) {
      var bDates = Object.keys(data.buffHistory).sort();
      if (bDates.length > 0) {
        var dailyKeys = bDates.filter(function(d){ return d.length === 10; });
        var hourlyKeys = bDates.filter(function(d){ return d.length > 10; });
        var bFirst = dailyKeys[0] || bDates[0];
        var bLast = dailyKeys[dailyKeys.length-1] || bDates[bDates.length-1];
        var bDays = dailyKeys.length || 0;
        // 统计悠悠覆盖
        var latestKey = hourlyKeys.length ? hourlyKeys[hourlyKeys.length-1] : bDates[bDates.length-1];
        var latestDay = data.buffHistory[latestKey] || {};
        var yyCount = 0, buffCount = 0;
        Object.keys(latestDay).forEach(function(k){
          var it = latestDay[k];
          if (it.buff_sell > 0) buffCount++;
          if (it.yyyp_sell > 0) yyCount++;
        });
        tl += '<div class="row"><span class="label">BUFF快照</span><span class="value" style="color:var(--blue)">' + bDays + '天·' + hourlyKeys.length + '小时 · ' + buffCount + '件</span></div>';
        tl += '<div class="row"><span class="label">悠悠快照</span><span class="value" style="color:var(--amber)">' + bDays + '天·' + hourlyKeys.length + '小时 · ' + yyCount + '件</span></div>';
        tl += '<div class="row"><span class="label" style="padding-left:16px;color:var(--text3)">范围</span><span class="value" style="color:var(--text2)">' + bFirst + ' → ' + bLast + '</span></div>';
        tl += '<div class="row"><span class="label" style="padding-left:16px;color:var(--text3)">监控跨度</span><span class="value" style="color:var(--text2)">' + bDays + '天（' + (bDays/30).toFixed(1) + '个月）</span></div>';
      }
    }
    if (data.dataStatus && data.dataStatus.price_dates) {
      var pDates = data.dataStatus.price_dates;
      var pFirst = pDates[0], pLast = pDates[pDates.length-1];
      var pDays = Math.floor((new Date(pLast) - new Date(pFirst)) / 86400000) || pDates.length;
      tl += '<div class="row"><span class="label">价格历史</span><span class="value" style="color:var(--fall)">' + pDates.length + '天</span></div>';
      tl += '<div class="row"><span class="label" style="padding-left:16px;color:var(--text3)">范围</span><span class="value" style="color:var(--text2)">' + pFirst + ' → ' + pLast + '</span></div>';
      tl += '<div class="row"><span class="label" style="padding-left:16px;color:var(--text3)">跨度</span><span class="value" style="color:var(--text2)">' + pDays + '天（' + (pDays/30).toFixed(1) + '个月）</span></div>';
    } else if (data.priceHistory) {
      // fallback to old behavior
      var pDates = Object.keys(data.priceHistory).sort();
      if (pDates.length > 0) {
        tl += '<div class="row"><span class="label">价格历史</span><span class="value" style="color:var(--fall)">' + pDates.length + '个标的</span></div>';
      }
    }
    document.getElementById('timeline').innerHTML = tl || '<div class="empty">暂无历史数据</div>';

    // 数据量
    var vol = '';
    if (data.marketScan) {
      vol += '<div class="row"><span class="label">全量扫描</span><span class="value">' + (data.marketScan.total||0).toLocaleString() + '件</span></div>';
      vol += '<div class="row"><span class="label" style="padding-left:16px;color:var(--text3)">有价可查</span><span class="value">' + (data.marketScan.tracked||0).toLocaleString() + '件</span></div>';
      vol += '<div class="row"><span class="label" style="padding-left:16px;color:var(--text3)">品类</span><span class="value">' + (data.marketScan.categories ? Object.keys(data.marketScan.categories).length : 0) + '类</span></div>';
      vol += '<div class="row"><span class="label" style="padding-left:16px;color:var(--text3)">均价</span><span class="value">¥' + (data.marketScan.avg_p||0).toFixed(0) + '</span></div>';
    }
    if (data.ecoTracked) {
      vol += '<div class="row"><span class="label">追踪数据</span><span class="value">' + (Array.isArray(data.ecoTracked) ? data.ecoTracked.length.toLocaleString() : '--') + '件</span></div>';
    }
    document.getElementById('dataVolume').innerHTML = vol || '<div class="empty">加载中...</div>';
  }).catch(function() {
    document.getElementById('statusNow').textContent = '加载失败';
  });
}

loadStatus();

(function(){
  var _last = Date.now();
  setInterval(function(){
    fetch('market.json?v=' + Date.now(), {cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      var ut = d.update_time || d.alerts_updated || '';
      if (ut && new Date(ut).getTime() > _last) { _last = new Date(ut).getTime(); loadStatus(); }
    }).catch(function(){});
  }, 60000);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 机会扫描</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='none' stroke='%2360a5fa' stroke-width='2'/%3E%3Ctext x='20' y='27' font-size='22' text-anchor='middle' fill='%2360a5fa' font-family='Georgia,serif'%3E%CE%B1%3C/text%3E%3C/svg%3E">
<meta name="description" content="AlphaTrack · CS2 机会扫描：捡漏（低估）扫描、跨平台价差套利、流动性健康度。">
<meta property="og:title" content="CS2 机会扫描">
<meta property="og:type" content="website">
<meta name="theme-color" content="#020617">
<style>
:root{--bg:#0d1117;--surface:rgba(22,27,34,.85);--surface2:rgba(30,36,46,.7);--border:rgba(55,65,81,.4);--text:#d1d5db;--text2:#9ca3af;--text3:#6b7280;--rise:#ef4444;--fall:#22c55e;--blue:#60a5fa;--amber:#fbbf24;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1040px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.sub{font-size:12px;color:var(--text3);margin-top:4px}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.header .nav a{color:var(--blue);text-decoration:none;font-size:12px;margin-left:12px}
.header .nav a:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:4px;letter-spacing:.3px}
.card .hint{font-size:11px;color:var(--text3);margin-bottom:12px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 8px;color:var(--text3);font-size:11px;font-weight:600;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px;border-bottom:1px solid rgba(55,65,81,.08);vertical-align:middle}
tr:last-child td{border-bottom:none}
.mono{font-family:'DM Mono','JetBrains Mono',monospace}
.rise{color:var(--rise)}.fall{color:var(--fall)}.blue{color:var(--blue)}.amber{color:var(--amber)}
.dim{color:var(--text3)}
.name-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px}
.kpi-l{font-size:11px;color:var(--text3);margin-bottom:4px}
.kpi-v{font-size:19px;font-weight:800;font-family:'DM Mono','JetBrains Mono',monospace}
.kpi-s{font-size:10px;color:var(--text3);margin-top:3px}
.bar{height:5px;border-radius:3px;background:rgba(55,65,81,.35);overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;border-radius:3px}
.pill{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;border:1px solid var(--border);color:var(--text2)}
.pill.ok{border-color:rgba(239,68,68,.4);color:var(--rise)}
.pill.warn{border-color:rgba(251,191,36,.4);color:var(--amber)}
.empty{text-align:center;padding:28px;color:var(--text3);font-size:12px}
.note{font-size:11px;color:var(--text3);line-height:1.6;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px}
details summary{cursor:pointer;color:var(--text2);font-size:12px;padding:6px 0}
details summary:hover{color:var(--blue)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:5px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);background:transparent}
.tab.on{background:var(--surface2);color:var(--text);border-color:var(--blue)}
.btn{padding:5px 11px;border:1px solid var(--border);border-radius:6px;font-size:11px;cursor:pointer;color:var(--text2);background:transparent;font-family:inherit}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.loading{text-align:center;padding:40px;color:var(--text3);font-size:12px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>机会扫描</h1>
      <div class="sub">捡漏（低估）· 跨平台价差 · 流动性健康度 —— 数据来自服务器统计引擎，非实时行情</div>
    </div>
    <div class="nav">
      <a href="index.html">看板</a>
      <a href="backtest.html">回测</a>
      <a href="fluctuation.html">异动</a>
      <a href="status.html">状态</a>
    </div>
  </div>

  <div id="loading" class="loading">加载中…</div>
  <div id="content" style="display:none">

    <div class="note" id="caveat"></div>

    <div class="kpis" id="kpis"></div>

    <div class="tabs">
      <div class="tab on" data-t="pickup">捡漏</div>
      <div class="tab" data-t="arb">价差套利</div>
      <div class="tab" data-t="liq">流动性</div>
      <div class="tab" data-t="susp">待核查</div>
    </div>

    <div class="card" id="panel">
      <h2 id="p-title"></h2>
      <div class="hint" id="p-hint"></div>
      <div id="p-body"></div>
    </div>

    <div class="card">
      <h2>自选对比</h2>
      <div class="hint">输入若干件饰品名（用换行或逗号分隔，请用 BUFF 英文 market_hash 或中文名），对比它们当前价与 30 日区间位置。数据来自 price_summary.json。</div>
      <textarea id="cmpInput" rows="3" placeholder="例：AK-47 | Redline (Field-Tested)&#10;AWP | Dragon Lore (Factory New)" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px;font-size:12px;font-family:inherit"></textarea>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn" onclick="runCompare()">对比</button>
        <button class="btn" onclick="exportCSV()">导出当前表 CSV</button>
      </div>
      <div id="cmpBody" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<script>
var ST = { opp:null, liq:null, summary:null, tab:'pickup' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(v){ return (v>=0?'':'-') + '¥' + Math.abs(v).toFixed(2); }
function num(v,d){ return (v==null||isNaN(v))?'—':Number(v).toFixed(d==null?2:d); }

function get(p){
  return fetch(p + '?v=' + Math.floor(Date.now()/600000), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .catch(function(){ return null; });
}

function load(){
  Promise.all([get('opportunity.json'), get('liquidity_score.json'), get('price_summary.json')])
    .then(function(r){
      ST.opp=r[0]; ST.liq=r[1]; ST.summary=r[2];
      document.getElementById('loading').style.display='none';
      document.getElementById('content').style.display='';
      render();
    });
}

function render(){
  var o=ST.opp||{};
  document.getElementById('caveat').textContent = o.caveat || '';

  // KPI
  var arb=o.arbitrage||[], pk=o.undervalued||[], sp=o.suspicious||[];
  var li=(ST.liq||{}).items||[];
  var badLiq=li.filter(function(x){ return typeof x.score==='number' && x.score<=30; }).length;
  document.getElementById('kpis').innerHTML =
    kpi('捡漏候选', pk.length+' 件', '价格处 30 日低位+有流动性') +
    kpi('可信价差', arb.length+' 件', '已过异常挂单三重校验') +
    kpi('隔离待核查', sp.length+' 件', '疑似天价/失真挂单，不采用') +
    kpi('流动性告警', badLiq+' 件', '评分 ≤30，不好卖');

  bindTabs();
  renderTab();
}

function kpi(l,v,s){
  return '<div class="kpi"><div class="kpi-l">'+esc(l)+'</div>'+
    '<div class="kpi-v">'+esc(v)+'</div><div class="kpi-s">'+esc(s)+'</div></div>';
}

function bindTabs(){
  var ts=document.querySelectorAll('.tab');
  for(var i=0;i<ts.length;i++){
    ts[i].onclick=function(){
      for(var j=0;j<ts.length;j++) ts[j].classList.remove('on');
      this.classList.add('on');
      ST.tab=this.getAttribute('data-t');
      renderTab();
    };
  }
}

function renderTab(){
  var o=ST.opp||{}, t=ST.tab;
  var title=document.getElementById('p-title'), hint=document.getElementById('p-hint'),
      body=document.getElementById('p-body');

  if(t==='pickup'){
    title.textContent='捡漏（低估）扫描';
    hint.textContent='口径：现价处于自身 30 日价格区间低位（百分位 ≤25%）+ 有货可买、有人收；若 Kronos 有预测则叠加方向加权。「低估」是相对自身近期区间而言，不等于必涨。';
    body.innerHTML = tablePickup(o.undervalued||[]);
  } else if(t==='arb'){
    title.textContent='跨平台价差（套利参考）';
    hint.textContent='只列可提现方向（BUFF→悠悠）。已过滤天价/失真挂单：悠悠报价不得高于 Steam 的 1.25 倍、毛价差上限 50%。Steam 余额不可提现，其价差是系统性溢价（全市场中位数 +49%），不计入本榜。';
    body.innerHTML = tableArb(o.arbitrage||[]);
  } else if(t==='liq'){
    title.textContent='流动性健康度（持仓）';
    hint.textContent='回答「这件我现在想卖，掉不掉价、多久能出」。评分含在售量、求购量、买卖价差、7 日在售量变化。分数低 ≠ 一定亏，是「不好卖/滑点大」的客观提示。';
    body.innerHTML = tableLiq((ST.liq||{}).items||[]);
  } else {
    title.textContent='待核查（疑似异常报价）';
    hint.textContent='这些条目因报价失真被隔离，不进主榜。列出仅供人工核查，不作为机会。';
    body.innerHTML = tableSusp(o.suspicious||[]);
  }
}

function tablePickup(rows){
  if(!rows.length) return empty('暂无符合条件的捡漏标的');
  var h='<table><thead><tr><th>饰品</th><th>现价</th><th>30日区间</th><th>区间位置</th><th>Kronos 14日</th><th>在售</th><th>求购</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var pct=r.pctile, col = pct<=10?'var(--rise)':(pct<=25?'var(--amber)':'var(--text2)');
    var fc = (r.kronos_pct==null) ? '<span class="dim">—</span>'
      : '<span class="'+(r.kronos_pct>=0?'rise':'fall')+'">'+(r.kronos_pct>=0?'+':'')+num(r.kronos_pct,1)+'%</span>';
    h+='<tr>'+
      '<td class="name-cell" title="'+esc(r.hash_name)+'">'+esc(r.name)+'</td>'+
      '<td class="mono">'+money(r.current)+'</td>'+
      '<td class="mono dim">'+num(r.low30,0)+' ~ '+num(r.high30,0)+'</td>'+
      '<td><div class="bar"><i style="width:'+pct+'%;background:'+col+'"></i></div>'+
        '<div class="dim" style="font-size:10px;margin-top:2px">'+num(pct,0)+'% 低位</div></td>'+
      '<td>'+fc+'</td>'+
      '<td class="mono dim">'+num(r.sell_num,0)+'</td>'+
      '<td class="mono dim">'+num(r.buy_num,0)+'</td></tr>';
  });
  return h+'</tbody></table>';
}

function tableArb(rows){
  if(!rows.length) return empty('暂无可信的价差机会（异常报价已隔离）');
  var h='<table><thead><tr><th>饰品</th><th>方向</th><th>买入(BUFF)</th><th>卖出</th><th>价差</th><th>幅度</th><th>在售</th><th>说明</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var sell = r.yyyp_sell!=null ? r.yyyp_sell : r.steam_sell;
    h+='<tr>'+
      '<td class="name-cell" title="'+esc(r.hash_name)+'">'+esc(r.name)+'</td>'+
      '<td><span class="pill">'+esc(r.best_route)+'</span></td>'+
      '<td class="mono">'+money(r.buff_sell)+'</td>'+
      '<td class="mono">'+money(sell)+'</td>'+
      '<td class="mono rise">+'+num(r.spread,2)+'</td>'+
      '<td class="mono rise">+'+num(r.spread_pct,1)+'%</td>'+
      '<td class="mono dim">'+num(r.sell_num,0)+'</td>'+
      '<td class="dim" style="font-size:11px">'+esc(r.note||'')+'</td></tr>';
  });
  return h+'</tbody></table>';
}

function tableLiq(rows){
  if(!rows.length) return empty('暂无流动性数据');
  rows.sort(function(a,b){ return (a.score||0)-(b.score||0); });
  var h='<table><thead><tr><th>饰品</th><th>评分</th><th>档位</th><th>在售量</th><th>求购量</th><th>买卖价差</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var sc=r.score||0, col = sc<=30?'var(--fall)':(sc<=60?'var(--amber)':'var(--rise)');
    h+='<tr>'+
      '<td class="name-cell">'+esc(r.name||r.hash_name)+'</td>'+
      '<td><div class="bar"><i style="width:'+sc+'%;background:'+col+'"></i></div>'+
        '<div class="dim" style="font-size:10px;margin-top:2px">'+num(sc,0)+'</div></td>'+
      '<td>'+esc(r.grade||'—')+'</td>'+
      '<td class="mono dim">'+num(r.sell_num,0)+'</td>'+
      '<td class="mono dim">'+num(r.buy_num,0)+'</td>'+
      '<td class="mono dim">'+(r.spread!=null?num(r.spread,1)+'%':'—')+'</td></tr>';
  });
  return h+'</tbody></table>';
}

function tableSusp(rows){
  if(!rows.length) return empty('没有被隔离的异常条目');
  var h='<table><thead><tr><th>饰品</th><th>BUFF</th><th>悠悠</th><th>Steam</th><th>参考锚价</th><th>拒绝原因</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var reasons=(r.routes||[]).map(function(x){ return x.reject||'异常'; }).join('；');
    h+='<tr>'+
      '<td class="name-cell" title="'+esc(r.hash_name)+'">'+esc(r.name)+'</td>'+
      '<td class="mono">'+money(r.buff_sell)+'</td>'+
      '<td class="mono dim">'+(r.yyyp_sell!=null?money(r.yyyp_sell):'—')+'</td>'+
      '<td class="mono dim">'+(r.steam_sell!=null?money(r.steam_sell):'—')+'</td>'+
      '<td class="mono dim">'+(r.anchor!=null?money(r.anchor):'—')+'</td>'+
      '<td class="dim" style="font-size:11px">'+esc(reasons)+'</td></tr>';
  });
  return h+'</tbody></table>';
}

function empty(t){ return '<div class="empty">'+esc(t)+'</div>'; }

/* ── 自选对比：用 price_summary.json 的 30 日序列算区间位置 ── */
function findSummary(key){
  var s=ST.summary||{};
  if(s[key]) return s[key];
  var lk=String(key).trim().toLowerCase();
  var ks=Object.keys(s);
  for(var i=0;i<ks.length;i++){ if(ks[i].toLowerCase().indexOf(lk)>=0) return s[ks[i]]; }
  return null;
}
function pctileOf(rec){
  var ps=(rec&&rec.prices||[]).filter(function(p){ return typeof p==='number'&&p>0; });
  if(ps.length<5) return null;
  var cur=ps[ps.length-1], lo=Math.min.apply(null,ps), hi=Math.max.apply(null,ps);
  return {cur:cur, lo:lo, hi:hi, pct: hi<=lo?50:(cur-lo)/(hi-lo)*100, n:ps.length};
}
function runCompare(){
  var raw=document.getElementById('cmpInput').value||'';
  var keys=raw.split(/[\n,，;；]+/).map(function(x){return x.trim();}).filter(Boolean);
  var box=document.getElementById('cmpBody');
  if(!keys.length){ box.innerHTML=empty('请输入至少一个名称'); return; }
  var h='<table><thead><tr><th>饰品</th><th>现价</th><th>30日低</th><th>30日高</th><th>区间位置</th></tr></thead><tbody>';
  var miss=[];
  keys.forEach(function(k){
    var rec=findSummary(k);
    if(!rec){ miss.push(k); return; }
    var m=pctileOf(rec);
    if(!m){ miss.push(k+'（样本不足）'); return; }
    var col=m.pct<=25?'var(--rise)':(m.pct<=60?'var(--amber)':'var(--fall)');
    h+='<tr><td class="name-cell">'+esc(k)+'</td>'+
      '<td class="mono">'+money(m.cur)+'</td>'+
      '<td class="mono dim">'+num(m.lo,0)+'</td>'+
      '<td class="mono dim">'+num(m.hi,0)+'</td>'+
      '<td><div class="bar"><i style="width:'+m.pct+'%;background:'+col+'"></i></div>'+
      '<div class="dim" style="font-size:10px;margin-top:2px">'+num(m.pct,0)+'%</div></td></tr>';
  });
  h+='</tbody></table>';
  if(miss.length) h+='<div class="dim" style="font-size:11px;margin-top:8px">未匹配：'+esc(miss.join('、'))+'</div>';
  box.innerHTML=h;
}

/* ── 导出当前表为 CSV ── */
function exportCSV(){
  var t=document.querySelector('#p-body table');
  if(!t){ alert('当前没有可导出的表格'); return; }
  var rows=[], trs=t.querySelectorAll('tr');
  for(var i=0;i<trs.length;i++){
    var cells=trs[i].querySelectorAll('th,td'), line=[];
    for(var j=0;j<cells.length;j++){
      var v=cells[j].textContent.replace(/\s+/g,' ').trim();
      line.push('"'+v.replace(/"/g,'""')+'"');
    }
    rows.push(line.join(','));
  }
  var blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='cs2_'+ST.tab+'_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

load();
/* 数据更新后自动重载（与其它页面同口径） */
setInterval(function(){
  fetch('data_status.json?ts='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){ if(d&&d.updated) load(); })
    .catch(function(){});
},300000);
</script>
</body>
</html>

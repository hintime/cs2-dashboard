<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--hair:rgba(48,54,61,.6);--text:#d1d5db;--text2:#9ca3af;--text3:#6b7280;--rise:#ef4444;--fall:#22c55e;--blue:#58a6ff;--amber:#fbbf24;--purple:#a855f7;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1000px;margin:0 auto;padding:24px 16px 32px}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:12px;color:var(--text3);margin-top:4px;line-height:1.6}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.header .nav a{color:var(--blue);text-decoration:none;font-size:12px;margin-left:12px}
.header .nav a:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 24px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:12px;letter-spacing:.3px}

/* ── 数据健康条 ── */
.health{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;border:1px solid var(--hair);background:var(--surface2);font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.6}
.health.ok{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.07)}
.health.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.health.bad{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
.health .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--text3)}
.health.ok .dot{background:var(--fall)}.health.warn .dot{background:var(--amber)}.health.bad .dot{background:var(--rise)}
.health .sep{color:var(--border)}
.health b{color:var(--text);font-weight:700}
.health .full{width:100%;font-size:12px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:transform .18s cubic-bezier(.16,1,.3,1),background .18s ease,border-color .18s ease}
.kpi:hover{transform:translateY(-2px);background:rgba(88,166,255,.06);border-color:rgba(148,163,184,.45)}
.kpi-l{font-size:12px;color:var(--text3);margin-bottom:4px}
.kpi-v{font-size:22px;font-weight:800;font-family:'DM Mono','JetBrains Mono',ui-monospace,monospace;letter-spacing:-.02em;line-height:1.15}
.kpi-v.rise{color:var(--rise)}.kpi-v.fall{color:var(--fall)}.kpi-v.blue{color:var(--blue)}.kpi-v.amber{color:var(--amber)}.kpi-v.dim{color:var(--text3)}
.kpi-sub{font-size:12px;color:var(--text3);margin-top:4px;line-height:1.5}

/* ── 工具条 ── */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:14px}
.tgroup{display:flex;align-items:center;gap:6px}
.tlabel{font-size:12px;color:var(--text3);margin-right:2px}
.chip{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:12px;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease;user-select:none;white-space:nowrap}
.chip:hover{border-color:rgba(148,163,184,.5);color:var(--text)}
.chip.on{background:rgba(88,166,255,.14);border-color:rgba(88,166,255,.5);color:var(--blue);font-weight:600}
.search{flex:1 1 180px;min-width:150px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-family:inherit;outline:none}
.search:focus{border-color:rgba(88,166,255,.6)}
.search::placeholder{color:var(--text3)}
.count{font-size:12px;color:var(--text3);margin-left:auto;white-space:nowrap}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{padding:10px 12px;color:var(--text3);font-size:12px;letter-spacing:.5px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;user-select:none}
th.sortable{cursor:pointer;transition:color .15s ease}
th.sortable:hover{color:var(--text)}
th .arw{opacity:.45;font-size:10px;margin-left:3px}
th.act{color:var(--blue)}th.act .arw{opacity:1}
td{padding:9px 12px;border-bottom:1px solid var(--hair);color:var(--text2);font-size:12px}
tbody tr{transition:background .15s ease}
tbody tr:hover{background:rgba(88,166,255,.05)}
td.rise{color:var(--rise);font-weight:700}td.fall{color:var(--fall);font-weight:700}
td.num{font-family:'DM Mono','JetBrains Mono',ui-monospace,monospace;white-space:nowrap}
td.name{color:var(--text);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mkt-yyyp{background:rgba(251,191,36,.14);color:var(--amber)}

/* ── 空状态 ── */
.empty{padding:36px 20px;text-align:center}
.empty .ico{font-size:26px;opacity:.5;margin-bottom:8px}
.empty .t{font-size:13px;color:var(--text2);font-weight:600;margin-bottom:6px}
.empty .d{font-size:12px;color:var(--text3);line-height:1.7;max-width:540px;margin:0 auto}
.empty .d code{background:var(--surface2);border:1px solid var(--hair);border-radius:4px;padding:1px 5px;font-size:11px;color:var(--text2)}

.badge{display:inline-block;padding:3px 7px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-up{background:rgba(34,197,94,.14);color:var(--fall)}
.badge-down{background:rgba(239,68,68,.14);color:var(--rise)}

.more{display:block;width:100%;margin-top:12px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;transition:border-color .15s ease,color .15s ease}
.more:hover{border-color:rgba(148,163,184,.5);color:var(--text)}

.diag{margin-top:8px;padding:12px 16px;border:1px solid var(--hair);border-radius:10px;background:var(--surface2);font-size:12px;color:var(--text3);line-height:1.8}
.diag .dh{color:var(--text2);font-weight:600;margin-bottom:6px;font-size:12px}
.diag code{background:rgba(48,54,61,.6);border-radius:4px;padding:1px 5px;font-size:11px;color:var(--text2)}
.diag .kv{display:inline-block;margin-right:16px}

.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:640px){
  .container{padding:18px 12px 28px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .card{padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:560px}
  .kpi-v{font-size:19px}
  .toolbar{gap:6px;padding:8px 10px}
  .tgroup{flex-wrap:wrap}
  .count{margin-left:0;width:100%}
}
</style>

<script src="ai-badge.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   在售量异动 —— 2026-09-24 重写
   修掉的三个历史 bug：
     ① 时点选取混入日级键（'2026-09-14' 这类 10 位键）。因为
        '2026-09-14' < '2026-09-14T20:00'，sorted() 后日级键永远排在
        当天小时级键之前 → 所谓「相邻时点」实际跨越数日。
        现在只认 16 位小时级键。
     ② 不校验两期饰品集合是否可比。09-14 是 4805 件全量、09-19 起降到
        200 件，直接相减出来的「异动」大多来自样本增减而非市场变化。
        现在用集合重叠率把关并在页面上如实标出。
     ③ 基准期最小在售量硬编码 100，大量低库存饰品被直接过滤，叠加 ①②
        就变成四张空卡片。现在可切换，默认 20。
   原则：没有数据就说没有并说明原因；绝不用当前值回填历史造假序列。
   ══════════════════════════════════════════════════════════════════ */

var T = Math.floor(Date.now() / 900000);

var state = {
  raw: null, now: null, prev: null,
  gapHours: 0, overlap: 0, stats: null,
  rows: [], shown: 60,
  f: { mkt: 'all', dir: 'all', th: 10, mb: 20, span: 1, q: '' },
  sort: { key: 'pct', dir: -1 }
};

var nameMap = {};
function cn(n) { return nameMap[n] || n; }

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function isHourlyKey(k) {
  return typeof k === 'string' && k.length === 16 && k.charAt(10) === 'T';
}

/* 快照体检：这一期里各市场到底有多少条真数据 */
function snapStats(snap) {
  var keys = Object.keys(snap || {}), buff = 0, yyyp = 0, steam = 0;
  for (var i = 0; i < keys.length; i++) {
    var e = snap[keys[i]] || {};
    if ((e[F('buff', 'num')] || 0) > 0) buff++;
    if ((e[F('yyyp', 'num')] || 0) > 0) yyyp++;
    if ((e.steam_sell || 0) > 0) steam++;   // mini 格式无此字段，恒 0
  }
  return { total: keys.length, buff: buff, yyyp: yyyp, steam: steam };
}

var MARKETS = [
  { key: 'buff', label: 'BUFF' },
  { key: 'yyyp', label: '悠悠' }
];

/* 字段映射：mini 格式（fluct_recent.json，b/bs/y/ys）与 full 格式
   （buff_recent.json，全名字段）自动识别。full 仅作服务器未产出 mini
   文件时的兜底，24 小时后可移除。 */
var FIELDS = {
  mini: { buff: { num: 'b',  price: 'bs' }, yyyp: { num: 'y',  price: 'ys' } },
  full: { buff: { num: 'buff_sell_num', price: 'buff_sell' }, yyyp: { num: 'yyyp_sell_num', price: 'yyyp_sell' } }
};
var fmt = 'full';
function F(mkt, kind) { return FIELDS[fmt][mkt][kind]; }

/* 时点配对：只取小时级，按「对比跨度」往前找规模可比的期。
   ⚠ 不能取「重叠率最高」——上一期若是全量池（4805 件）而本期只有 200 件，
   单向重叠仍是 100%，但两期根本不是同一批样本，算出来的变化全是假的
   （实测会把悠悠 4740→0 当成 197 条「疑似扫货 -100%」）。
   所以硬门槛是样本规模比值，其次才是集合重叠。
   spanH=1 → 最近的可比期；6/12 → 找距 now 最接近该跨度的期（容差 ×0.4~×1.6）。 */
function pickPair(data, spanH) {
  var all = Object.keys(data || {});
  var hourly = all.filter(isHourlyKey).sort();
  var skippedDaily = all.filter(function (k) { return !isHourlyKey(k); });

  if (hourly.length < 2) return { ok: false, reason: 'hourly_lt2', hourly: hourly, skippedDaily: skippedDaily };

  var now = hourly[hourly.length - 1];
  var nowKeys = Object.keys(data[now] || {});
  var stNow = snapStats(data[now]);
  if (!nowKeys.length) return { ok: false, reason: 'now_empty', hourly: hourly, skippedDaily: skippedDaily, stNow: stNow };

  var nowSet = {};
  nowKeys.forEach(function (k) { nowSet[k] = 1; });

  /* 遍历所有候选，取「间隔最接近目标跨度」且合格的期。
     （不能遇到第一个合格的就返回——12h 档会误选 5h 前的期） */
  var best = null;
  for (var i = hourly.length - 2; i >= 0; i--) {
    var cand = hourly[i];
    var gap = gapHours(cand, now);
    if (gap > spanH * 1.6) break;                  // 超出跨度容差，再往前只会更远，停
    if (spanH > 1 && gap < spanH * 0.4) continue;  // 比目标跨度近太多的跳过（要的就是这个跨度）
    var stC = snapStats(data[cand]);
    if (!stC.total) continue;

    var ratio = stC.total / stNow.total;
    if (ratio < 0.5 || ratio > 2.0) continue;      // 样本规模差一倍以上 → 不是同一批池子

    var hit = 0, ck = Object.keys(data[cand]);
    for (var j = 0; j < ck.length; j++) if (nowSet[ck[j]]) hit++;
    var ov = hit / Math.max(nowKeys.length, 1);
    // ⚠ 采集端为动态挑选（2026-09-24 义轩拍板：不做固定名单，保覆盖面），
    //   各期抓的饰品部分轮换（实测相邻期交集 10%~68%）。门槛放宽到 15%，
    //   尽量多出数据；只对比两期都出现的饰品，共同样本数如实标注在健康条。
    if (ov < 0.15) continue;

    var dist = Math.abs(gap - spanH);
    if (!best || dist < best.dist) {
      best = { prev: cand, overlap: ov, common: hit, gap: gap, dist: dist };
    }
  }

  if (best) {
    return {
      ok: true, now: now, prev: best.prev, overlap: best.overlap,
      common: best.common, gapHours: best.gap,
      hourly: hourly, skippedDaily: skippedDaily
    };
  }
  return { ok: false, reason: 'no_comparable', hourly: hourly, skippedDaily: skippedDaily, stNow: stNow };
}

/* 单个市场是否可比：两期都得有量，且覆盖条数量级差不太多。
   覆盖条数从 4740 掉到 0 属于采集侧断流，不是市场变化，必须判不可比。 */
function marketComparable(m, stNow, stPrev) {
  var a = stNow[m.key] || 0, b = stPrev[m.key] || 0;
  if (a <= 0) return { ok: false, why: 'now_zero' };
  if (b <= 0) return { ok: false, why: 'prev_zero' };
  var r = Math.min(a, b) / Math.max(a, b);
  if (r < 0.5) return { ok: false, why: 'coverage_gap', a: a, b: b };
  return { ok: true, a: a, b: b };
}

function mktWhyText(m, r) {
  if (r.why === 'now_zero')     return '本期无' + m.label + '在售量数据';
  if (r.why === 'prev_zero')    return '上期无' + m.label + '数据，无法对比';
  if (r.why === 'coverage_gap') return m.label + '覆盖 ' + r.b + '→' + r.a + ' 条，量级突变不可比';
  return '';
}

function keyToTime(s) {
  return new Date(s.slice(0, 4) + '-' + s.slice(5, 7) + '-' + s.slice(8, 10) +
                  'T' + s.slice(11, 13) + ':' + s.slice(14, 16) + ':00').getTime();
}

function gapHours(a, b) {
  var d = keyToTime(b) - keyToTime(a);
  return isFinite(d) ? Math.round(d / 3600000) : 0;
}

function classifySignal(c) {
  if (c.pct <= -30 && c.nowNum < 50)  return { label: '疑似扫货', cls: 'badge-warn', rank: 3 };
  if (c.pct <= -15 && c.nowNum < 100) return { label: '在售减少', cls: 'badge-down', rank: 1 };
  if (c.pct >= 30 && c.nowNum > 100)  return { label: '疑似砸盘', cls: 'badge-warn', rank: 3 };
  if (c.pct >= 15 && c.nowNum > 50)   return { label: '在售增加', cls: 'badge-up', rank: 1 };
  if (c.pct < 0) return { label: '减少', cls: 'badge-down', rank: 0 };
  return { label: '增加', cls: 'badge-up', rank: 0 };
}

/* ── 入口 ──
   ★ 2026-09-24：改用微缩快照 fluct_recent.json（~80KB，最近 3 期 + 内嵌中文名）。
   旧版拉 buff_recent.json(2.5MB) + eco_tracked.json(6.4MB) → 弱网十几秒打不开。 */
function loadFluct() {
  fetch('fluct_recent.json?v=' + T)
    .then(function (r) {
      if (!r.ok) throw 0;
      fmt = 'mini';
      return r.json();
    })
    .catch(function () {
      // 兜底：服务器尚未产出 mini 文件时退回大文件（全名字段）
      fmt = 'full';
      return fetch('buff_recent.json?v=' + T)
        .then(function (r) { return r.ok ? r.json() : null; });
    })
    .then(function (data) {
      if (!data) { fail('未取到在售量快照'); return; }
      build(data);
    })
    .catch(function () { fail('加载失败：网络或数据文件不可用'); });
}

function fail(msg) {
  document.getElementById('fluctDate').textContent = msg;
  var hb = document.getElementById('healthBar');
  hb.className = 'health bad';
  hb.innerHTML = '<span class="dot"></span><span>' + esc(msg) + '</span>';
  document.getElementById('fluctKpis').innerHTML =
    '<div class="kpi"><div class="kpi-l">数据不可用</div><div class="kpi-v dim">—</div>' +
    '<div class="kpi-sub">请确认采集任务是否在运行</div></div>';
  document.getElementById('allList').innerHTML =
    '<tr><td colspan="8"><div class="empty"><div class="ico">⚠</div>' +
    '<div class="t">无法读取在售量快照</div><div class="d">' + esc(msg) +
    '。<br>本页依赖 <code>buff_recent.json</code>，由采集任务每次更新时写出。</div></div></td></tr>';
}

function build(data) {
  state.raw = data;
  refresh();
}

/* 重新配对 + 渲染（对比跨度切换时也会走这里） */
function refresh() {
  var data = state.raw;
  if (!data) return;

  // mini 格式：中文名内嵌在每条记录的 cn 字段，顺手填进 nameMap（幂等）
  if (fmt === 'mini') {
    for (var k in data) {
      var snap = data[k] || {};
      for (var n in snap) {
        var e = snap[n];
        if (e && e.cn && !nameMap[n]) nameMap[n] = e.cn;
      }
    }
  }

  var spanH = state.f.span || 1;
  var pair = pickPair(data, spanH);

  if (!pair.ok) {
    var why;
    if (pair.reason === 'hourly_lt2') {
      why = '可用的小时级快照不足 2 个（当前 ' + pair.hourly.length + ' 个）';
    } else if (pair.reason === 'now_empty') {
      why = '最新一期快照是空的';
    } else {
      why = (spanH > 1
        ? '「' + spanH + ' 小时」跨度内没有规模可比的上一期（样本规模相差一倍以上，或集合重叠不足 15%）——可以换 1 小时档试试'
        : '现有快照里没有与最新一期规模可比的上一期（样本规模相差一倍以上，或饰品集合重叠不足 15%）');
    }
    document.getElementById('fluctDate').textContent = why;
    healthNone(why, pair);
    kpisNone();
    renderNone(why);
    renderDiag(pair, null);
    return;
  }

  state.now = pair.now; state.prev = pair.prev;
  state.gapHours = pair.gapHours; state.overlap = pair.overlap;
  state.stats = { now: snapStats(data[pair.now]), prev: snapStats(data[pair.prev]) };

  // 逐市场判定可比性：不可比的市场不参与计算，也不产生任何信号
  state.mktOk = {};
  MARKETS.forEach(function (m) {
    state.mktOk[m.key] = marketComparable(m, state.stats.now, state.stats.prev);
  });

  document.getElementById('fluctDate').textContent =
    '对比 ' + pair.prev + ' → ' + pair.now + '（间隔 ' + pair.gapHours + ' 小时）· 样本 ' +
    state.stats.now.total + ' 件';

  healthBar(pair, state.stats);
  compute();
  renderDiag(pair, state.stats);
}

/* 计算异动行：按市场分别算 */
function compute() {
  var mb = state.f.mb, th = state.f.th;
  var nowSnap = state.raw[state.now] || {};
  var prevSnap = state.raw[state.prev] || {};
  var rows = [];

  MARKETS.forEach(function (m) {
    var numK = F(m.key, 'num'), priceK = F(m.key, 'price');
    if (state.mktOk && !state.mktOk[m.key].ok) return;   // 该市场不可比 → 跳过，不造假
    for (var name in nowSnap) {
      if (!Object.prototype.hasOwnProperty.call(nowSnap, name)) continue;
      var t = nowSnap[name] || {};
      var y = prevSnap[name];
      if (!y) continue;
      var yNum = y[numK] || 0;
      if (yNum < mb) continue;              // 基准期在售量太小，百分比没有意义
      var tNum = t[numK] || 0;
      var delta = tNum - yNum;
      var pct = yNum > 0 ? delta / yNum * 100 : 0;
      if (Math.abs(pct) < th) continue;
      rows.push({
        name: name, mkt: m.key, prevNum: yNum, nowNum: tNum,
        delta: delta, pct: pct, price: t[priceK] || 0
      });
    }
  });

  rows.sort(function (a, b) { return Math.abs(b.pct) - Math.abs(a.pct); });
  state.rows = rows;
  state.shown = 60;
  renderKpis();
  renderTable();
}

function view() {
  var f = state.f, q = f.q.trim().toLowerCase();
  var out = state.rows.filter(function (r) {
    if (f.mkt !== 'all' && r.mkt !== f.mkt) return false;
    if (f.dir === 'down' && r.pct >= 0) return false;
    if (f.dir === 'up' && r.pct <= 0) return false;
    if (q && cn(r.name).toLowerCase().indexOf(q) < 0 && r.name.toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var s = state.sort;
  out.sort(function (a, b) {
    var va, vb;
    if (s.key === 'name') { va = cn(a.name); vb = cn(b.name); return va < vb ? -s.dir : (va > vb ? s.dir : 0); }
    if (s.key === 'mkt')  { va = a.mkt; vb = b.mkt; return va < vb ? -s.dir : (va > vb ? s.dir : 0); }
    if (s.key === 'price') va = a.price, vb = b.price;
    else if (s.key === 'prev') va = a.prevNum, vb = b.prevNum;
    else if (s.key === 'now') va = a.nowNum, vb = b.nowNum;
    else if (s.key === 'delta') va = Math.abs(a.delta), vb = Math.abs(b.delta);
    else va = Math.abs(a.pct), vb = Math.abs(b.pct);
    return (vb - va) * (s.dir > 0 ? -1 : 1);
  });
  return out;
}

function renderKpis() {
  var buff = state.rows.filter(function (r) { return r.mkt === 'buff'; });
  var yyyp = state.rows.filter(function (r) { return r.mkt === 'yyyp'; });
  var st = state.stats || { now: { total: 0, buff: 0, yyyp: 0 }, prev: { total: 0, buff: 0, yyyp: 0 } };

  function card(label, arr, cls, alive, note) {
    var down = 0;
    arr.forEach(function (r) { if (r.pct < 0) down++; });
    var v = alive ? String(arr.length) : '—';
    var sub = alive
      ? ('≥' + state.f.th + '% · ' + (arr.length ? down + ' 降 / ' + (arr.length - down) + ' 增' : '本期无命中'))
      : (note || '数据缺失');
    return '<div class="kpi"><div class="kpi-l">' + label + '</div>' +
           '<div class="kpi-v ' + (alive ? cls : 'dim') + '">' + v + '</div>' +
           '<div class="kpi-sub">' + esc(sub) + '</div></div>';
  }

  var sweeps = state.rows.filter(function (r) { return classifySignal(r).rank === 3 && r.pct < 0; });
  var dumps  = state.rows.filter(function (r) { return classifySignal(r).rank === 3 && r.pct > 0; });

  var ok = state.mktOk || {};
  var bOk = ok.buff ? ok.buff.ok : false;
  var yOk = ok.yyyp ? ok.yyyp.ok : false;

  document.getElementById('fluctKpis').innerHTML =
    card('BUFF 异动', buff, 'blue', bOk, bOk ? '' : mktWhyText(MARKETS[0], ok.buff || { why: 'now_zero' })) +
    card('悠悠异动', yyyp, 'amber', yOk, yOk ? '' : mktWhyText(MARKETS[1], ok.yyyp || { why: 'now_zero' })) +
    card('疑似扫货', sweeps, 'rise', true) +
    card('疑似砸盘', dumps, 'fall', true);

  document.getElementById('toolbar').hidden = false;
}

function renderTable() {
  var rows = view();
  var tb = document.getElementById('allList');
  var moreBtn = document.getElementById('moreBtn');

  if (!rows.length) {
    var reason = state.rows.length
      ? '当前筛选条件下没有匹配的记录，换个市场或清空搜索试试。'
      : '本期与上期相比，没有饰品在售量变化达到 ' + state.f.th + '%（基准量 ≥' + state.f.mb + ' 件）。' +
        '<br>可以把阈值降到 <code>5%</code>，或把基准量放宽到 <code>≥20</code>。';
    tb.innerHTML = '<tr><td colspan="8"><div class="empty"><div class="ico">◍</div>' +
      '<div class="t">无符合条件的异动</div><div class="d">' + reason + '</div></div></td></tr>';
    document.getElementById('rowCount').textContent = '0 条';
    moreBtn.hidden = true;
    return;
  }

  var slice = rows.slice(0, state.shown);
  tb.innerHTML = slice.map(rowHtml).join('');
  document.getElementById('rowCount').textContent = '显示 ' + slice.length + ' / ' + rows.length + ' 条';
  moreBtn.hidden = slice.length >= rows.length;
  moreBtn.textContent = '显示更多（还有 ' + (rows.length - slice.length) + ' 条）';
}

function rowHtml(r) {
  var sig = classifySignal(r);
  var dirCls = r.pct > 0 ? 'fall' : 'rise';
  var mktTag = r.mkt === 'buff'
    ? '<span class="mkt mkt-buff">BUFF</span>'
    : '<span class="mkt mkt-yyyp">悠悠</span>';
  return '<tr>' +
    '<td class="name" title="' + esc(cn(r.name)) + '">' + esc(cn(r.name)) + '</td>' +
    '<td>' + mktTag + '</td>' +
    '<td class="num">' + r.prevNum + '</td>' +
    '<td class="num">' + r.nowNum + '</td>' +
    '<td class="num ' + dirCls + '">' + (r.delta > 0 ? '+' : '') + r.delta + '</td>' +
    '<td class="num ' + dirCls + '">' + (r.pct > 0 ? '+' : '') + r.pct.toFixed(1) + '%</td>' +
    '<td class="num">' + (r.price > 0 ? '¥' + r.price.toFixed(1) : '—') + '</td>' +
    '<td><span class="badge ' + sig.cls + '">' + sig.label + '</span></td></tr>';
}

/* ── 健康条 ── */
function healthBar(pair, st) {
  var hb = document.getElementById('healthBar');
  var ageH = ageHours(pair.now);
  var cls = ageH <= 3 ? 'ok' : (ageH <= 24 ? 'warn' : 'bad');
  var p = [];
  p.push('<span class="dot"></span>');
  p.push('最新快照 <b>' + pair.now + '</b>（' + ageText(ageH) + '前）');
  p.push('<span class="sep">|</span>');
  p.push('对比 <b>' + pair.prev + '</b>');
  if (pair.gapHours > 6) {
    p.push('<span class="sep">|</span>');
    p.push('<b style="color:var(--amber)">间隔 ' + pair.gapHours + ' 小时</b>');
  }
  p.push('<span class="sep">|</span>');
  p.push('本期 <b>' + st.now.total + '</b> 件 · 两期共同 <b>' + (pair.common || 0) +
         '</b> 件（' + (pair.overlap * 100).toFixed(0) + '%）');
  p.push('<span class="sep">|</span>');
  p.push('BUFF 有量 <b>' + st.now.buff + '</b> · 悠悠有量 <b>' + st.now.yyyp + '</b>');
  hb.className = 'health ' + cls;
  hb.innerHTML = p.join(' ');

  if (ageH > 24) {
    hb.insertAdjacentHTML('beforeend',
      '<div class="full" style="color:var(--amber)">采集中断：最新快照已滞后 ' + ageText(ageH) +
      '，异动对比失去时效意义，请检查采集进程。</div>');
  }
  if (pair.common && pair.common < 100) {
    hb.insertAdjacentHTML('beforeend',
      '<div class="full" style="color:var(--amber)">两期共同样本 ' + pair.common +
      ' 件（采集端为动态挑选，每轮 200 件按热门程度轮换）。' +
      '异动结果只覆盖这批重合饰品，不代表全池。</div>');
  }
  var okm = state.mktOk || {}, off = [];
  MARKETS.forEach(function (m) { if (okm[m.key] && !okm[m.key].ok) off.push(m.label); });
  if (off.length) {
    hb.insertAdjacentHTML('beforeend',
      '<div class="full" style="color:var(--amber)">' + off.join(' / ') +
      ' 本期不参与异动计算（数据不可比，见底部诊断）。</div>');
  }
}

function healthNone(why, pair) {
  var hb = document.getElementById('healthBar');
  hb.className = 'health bad';
  hb.innerHTML = '<span class="dot"></span><span>' + esc(why) + '</span>' +
    (pair.hourly && pair.hourly.length
      ? '<span class="sep">|</span><span>现有小时级快照：' + pair.hourly.join('、') + '</span>' : '');
}

function kpisNone() {
  var one = function (l) {
    return '<div class="kpi"><div class="kpi-l">' + l + '</div><div class="kpi-v dim">—</div>' +
           '<div class="kpi-sub">无可比时点</div></div>';
  };
  document.getElementById('fluctKpis').innerHTML =
    one('BUFF 异动') + one('悠悠异动') + one('疑似扫货') + one('疑似砸盘');
  document.getElementById('toolbar').hidden = true;
}

function renderNone(why) {
  document.getElementById('allList').innerHTML =
    '<tr><td colspan="8"><div class="empty"><div class="ico">◍</div>' +
    '<div class="t">暂无可比的在售量快照</div><div class="d">' + esc(why) +
    '。<br>异动对比需要至少两个<b>同一批饰品</b>的快照。采集端已启用固定观察名单，' +
    '等固定名单下的快照累积出两期（历史节奏约 6 小时一轮）即可出第一条真实对比。</div></div></td></tr>';
  document.getElementById('rowCount').textContent = '';
  document.getElementById('moreBtn').hidden = true;
}

/* ── 底部诊断 ── */
function renderDiag(pair, st) {
  var box = document.getElementById('diagBox');
  var h = [];
  h.push('<div class="dh">数据诊断</div>');
  h.push('<div><span class="kv">小时级快照 <code>' + (pair.hourly || []).length + '</code> 个</span>' +
         '<span class="kv">已忽略日级键 <code>' + (pair.skippedDaily || []).length + '</code> 个</span></div>');
  if ((pair.skippedDaily || []).length) {
    h.push('<div>忽略原因：日级键（<code>YYYY-MM-DD</code>）与小时级键混排时，排序会把日级键挤到当天小时级键之前，' +
           '使「相邻时点」实际跨越数日。</div>');
  }
  if (pair.common) {
    h.push('<div>样本口径：采集端为动态挑选（2026-09-24 拍板，保覆盖面），' +
           '每轮 200 件按热门程度轮换，相邻期交集 10%~68%。' +
           '本页只对比两期都出现的饰品，异动结果仅代表重合部分。</div>');
  }
  if (st) {
    h.push('<div><span class="kv">本期样本 <code>' + st.now.total + '</code> 件</span>' +
           '<span class="kv">BUFF 有量 <code>' + st.now.buff + '</code></span>' +
           '<span class="kv">悠悠有量 <code>' + st.now.yyyp + '</code></span>' +
           (fmt === 'full' ? '<span class="kv">Steam 有价 <code>' + st.now.steam + '</code></span>' : '') +
           '</div>');
    h.push('<div><span class="kv">上期样本 <code>' + st.prev.total + '</code> 件</span>' +
           '<span class="kv">BUFF 有量 <code>' + st.prev.buff + '</code></span>' +
           '<span class="kv">悠悠有量 <code>' + st.prev.yyyp + '</code></span></div>');

    var okm = state.mktOk || {};
    MARKETS.forEach(function (m) {
      var r = okm[m.key];
      if (r && !r.ok) {
        h.push('<div style="color:var(--amber)">' + m.label + ' 本期不参与异动计算：' +
               esc(mktWhyText(m, r)) + '。</div>');
      }
    });
    if ((st.now.yyyp === 0 || st.prev.yyyp === 0) && MARKETS) {
      h.push('<div style="color:var(--text3)">悠悠在售量缺失的常见原因：采集端曾按小写平台名 ' +
             '<code>yyyp</code> 取值，而数据源返回的是大写 <code>YOUPIN</code>，字段一直取不到。' +
             '该问题已于 2026-09-24 修复，历史快照无法回溯补全，需等修复后的新快照累积出来。</div>');
    }
  }
  box.innerHTML = h.join('');
  box.hidden = false;
}

function ageHours(key) {
  if (!key || key.length < 16) return 0;
  var t = keyToTime(key);
  if (!isFinite(t)) return 0;
  return Math.max(0, (Date.now() - t) / 3600000);
}

function ageText(h) {
  if (h < 1) return Math.round(h * 60) + ' 分钟';
  if (h < 48) return h.toFixed(1) + ' 小时';
  return (h / 24).toFixed(1) + ' 天';
}

/* ── 交互 ── */
document.getElementById('toolbar').addEventListener('click', function (e) {
  var el = e.target && e.target.closest ? e.target.closest('.chip') : null;
  if (!el) return;
  var f = el.getAttribute('data-f'), v = el.getAttribute('data-v');
  if (!f) return;
  var sib = this.querySelectorAll('.chip[data-f="' + f + '"]');
  for (var i = 0; i < sib.length; i++) sib[i].classList.remove('on');
  el.classList.add('on');
  state.f[f] = (f === 'th' || f === 'mb' || f === 'span') ? parseInt(v, 10) : v;
  if (f === 'th' || f === 'mb') compute();
  else if (f === 'span') refresh();   // 跨度变了要重新配对
  else renderTable();
});

document.getElementById('searchBox').addEventListener('input', function (e) {
  state.f.q = e.target.value || '';
  state.shown = 60;
  renderTable();
});

document.querySelectorAll('th.sortable').forEach(function (th) {
  th.addEventListener('click', function () {
    var k = this.getAttribute('data-sort');
    if (state.sort.key === k) state.sort.dir = -state.sort.dir;
    else { state.sort.key = k; state.sort.dir = -1; }
    document.querySelectorAll('th.sortable').forEach(function (t) {
      t.classList.remove('act');
      var a = t.querySelector('.arw'); if (a) a.textContent = '↕';
    });
    this.classList.add('act');
    var arw = this.querySelector('.arw');
    if (arw) arw.textContent = state.sort.dir < 0 ? '↓' : '↑';
    renderTable();
  });
});

document.getElementById('moreBtn').addEventListener('click', function () {
  state.shown += 100;
  renderTable();
});

loadFluct();

/* 数据更新后自动重载 */
(function () {
  var last = Date.now();
  setInterval(function () {
    fetch('data_status.json?ts=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var ut = d && d.updated;
        if (ut && new Date(ut).getTime() > last) {
          last = new Date(ut).getTime();
          location.reload();
        }
      }).catch(function () {});
  }, 60000);
})();
</script>

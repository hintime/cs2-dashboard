<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 日报 · 投资分析</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='none' stroke='%2360a5fa' stroke-width='2'/%3E%3Ctext x='20' y='27' font-size='22' text-anchor='middle' fill='%2360a5fa' font-family='Georgia,serif'%3E%CE%B1%3C/text%3E%3C/svg%3E">
<meta name="description" content="AlphaTrack · CS2 每日投资分析：持仓体检、市场涨跌榜与 AI 日报。">
<meta property="og:title" content="CS2 日报 · 投资分析">
<meta property="og:description" content="AlphaTrack · CS2 每日投资分析：持仓体检、市场涨跌榜与 AI 日报。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#020617">
<style>
:root{--bg:#0d1117;--surface:rgba(22,27,34,.85);--surface2:rgba(30,36,46,.7);--border:rgba(55,65,81,.4);--text:#d1d5db;--text2:#9ca3af;--text3:#6b7280;--rise:#ef4444;--fall:#22c55e;--blue:#60a5fa;--amber:#fbbf24;--radius:12px;--shadow:0 2px 16px rgba(0,0,0,.25)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1000px;margin:0 auto;padding:24px 16px 32px}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:12px;color:var(--text3);margin-top:4px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.header .nav a{color:var(--blue);text-decoration:none;font-size:12px;margin-left:12px}
.header .nav a:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow);transition:border-color .25s ease}
.card:hover{border-color:rgba(148,163,184,.45)}
.card h2{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:12px;letter-spacing:.3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--surface2);border-radius:8px;padding:12px;text-align:center;transition:transform .18s cubic-bezier(.16,1,.3,1),background .18s ease}
.kpi:hover{transform:translateY(-2px);background:rgba(96,165,250,.08)}
.kpi-l{font-size:11px;color:var(--text3);margin-bottom:4px}
.kpi-v{font-size:20px;font-weight:800;font-family:'DM Mono','JetBrains Mono',monospace;letter-spacing:-.02em}
.kpi-v.rise{color:var(--rise)}.kpi-v.fall{color:var(--fall)}
.kpi-v.blue{color:var(--blue)}.kpi-v.amber{color:var(--amber)}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.col-t{font-size:11px;font-weight:600;margin-bottom:6px}
/* 行 */
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;font-size:12px;transition:background .18s ease}
.row:hover{background:rgba(96,165,250,.07)}
.row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.row .idx{color:var(--text3);font-size:10px;min-width:16px}
.row .v{min-width:64px;text-align:right;font-weight:600;font-family:'DM Mono',monospace;font-size:12px}
/* 迷你条形行 */
.brow{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;font-size:12px;transition:background .18s ease}
.brow:hover{background:rgba(96,165,250,.07)}
.brow .bl{min-width:44px;font-size:11px;color:var(--text2)}
.brow .btrack{flex:1;height:8px;background:rgba(55,65,81,.35);border-radius:4px;overflow:hidden}
.brow .bfill{height:100%;border-radius:4px;transition:width .8s ease}
.brow .bv{min-width:88px;text-align:right;font-family:'DM Mono',monospace;font-size:11px;color:var(--text2)}
.empty{text-align:center;padding:24px 12px;color:var(--text3);font-size:12px;line-height:1.6}
.note{font-size:10px;color:var(--text3);line-height:1.7;margin-top:8px}
.warn-line{font-size:11px;color:var(--amber);background:rgba(251,191,36,.07);border:1px dashed rgba(251,191,36,.35);border-radius:8px;padding:7px 10px;margin-top:8px;line-height:1.6}
.ai-box{font-size:12px;color:var(--text2);line-height:1.9;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.ai-meta{font-size:10px;color:var(--text3);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.badge-mini{display:inline-block;font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(96,165,250,.14);color:var(--blue);vertical-align:1px}
.ai-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(55,65,81,.08);font-size:12px;border-radius:6px;transition:background .18s ease}
.ai-item:hover{background:rgba(96,165,250,.07)}
.ai-item:last-child{border-bottom:none}
.ai-item .nm{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
.ai-item .vd{font-weight:600;font-size:11px}
@media(max-width:640px){
  .container{padding:16px 10px 24px}
  .card{padding:12px 14px}
  .kpi-v{font-size:18px}
  .row .v,.brow .bv{min-width:56px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>CS2 日报</h1>
      <div class="sub" id="reportDate">加载中...</div>
    </div>
    <div class="nav">
      <a href="/">← 返回看板</a>
    </div>
  </div>

  <!-- ═══ ① 持仓体检 ═══ -->
  <div class="card" id="portfolioSection">
    <h2>📦 持仓体检 <span class="badge-mini" id="pftMeta"></span></h2>
    <div class="kpis" id="portfolioKpis"></div>
    <div style="margin-top:14px" class="grid2">
      <div>
        <div class="col-t" style="color:var(--rise)">📈 持仓涨幅 TOP 5 <span style="color:var(--text3);font-weight:400">· 近 7 日</span></div>
        <div id="gainersList"></div>
      </div>
      <div>
        <div class="col-t" style="color:var(--fall)">📉 持仓跌幅 TOP 5 <span style="color:var(--text3);font-weight:400">· 近 7 日</span></div>
        <div id="losersList"></div>
      </div>
    </div>
    <div class="note" id="pftNote"></div>
  </div>

  <!-- ═══ ② AI 市场日报 ═══ -->
  <div class="card" id="aiDailySection" style="display:none">
    <h2>🧠 AI 市场日报 <span class="badge-mini">AI 注记 · 数字来自统计引擎</span></h2>
    <div id="aiDailyBox" class="ai-box"></div>
    <div class="grid2" style="margin-top:12px">
      <div>
        <div class="col-t" style="color:var(--rise)">📈 7日涨幅 TOP5 <span style="color:var(--text3);font-weight:400">· 全市场</span></div>
        <div id="mktGainers"></div>
      </div>
      <div>
        <div class="col-t" style="color:var(--fall)">📉 7日跌幅 TOP5 <span style="color:var(--text3);font-weight:400">· 全市场</span></div>
        <div id="mktLosers"></div>
      </div>
    </div>
    <div id="mktTiers" style="margin-top:8px"></div>
    <div class="ai-meta" id="aiDailyMeta"></div>
  </div>


</div>

<script>
function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}
function sgn(x) { return (x >= 0 ? '+' : '') + x; }
function posC(x) { return x >= 0 ? 'var(--rise)' : 'var(--fall)'; }
function money(x) { return '¥' + (x || 0).toFixed(0); }

function kpi(label, val, cls, sub) {
  return '<div class="kpi"><div class="kpi-l">' + label + '</div><div class="kpi-v ' + (cls || '') + '">' + val + '</div>' +
    (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') + '</div>';
}

/* ── 数据加载 ── */
function loadReport() {
  return fetch('daily_report.json?_t=' + Date.now())
    .then(function (r) { if (!r.ok) throw Error('daily_report 不可用'); return r.json(); })
    .catch(function (e) {
      document.getElementById('reportDate').textContent = '暂无日报数据（daily_report.json 不可用）';
      return null;
    });
}
function loadAiDaily() {
  return fetch('ai_daily_report.json?_t=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; });
}

/* ── ① 持仓体检 ── */
function renderPortfolio(p, date) {
  if (!p) { document.getElementById('portfolioSection').style.display = 'none'; return; }
  var pc = p.pnl >= 0 ? 'rise' : 'fall';
  document.getElementById('portfolioKpis').innerHTML =
    kpi('持仓件数', p.count, 'blue') +
    kpi('总成本', money(p.total_cost)) +
    kpi('总市值', money(p.total_value)) +
    kpi('浮动盈亏', (p.pnl >= 0 ? '+¥' : '-¥') + Math.abs(p.pnl || 0).toFixed(0), pc, sgn(p.pnl_pct || 0) + '%');
  document.getElementById('pftMeta').textContent = date ? ('数据日期 ' + date) : '';

  var rows = function (arr, dir) {
    if (!arr || !arr.length) return '<div class="empty">暂无数据</div>';
    var maxAbs = 0.01;
    arr.forEach(function (x) { maxAbs = Math.max(maxAbs, Math.abs(x.r7 || 0)); });
    return arr.map(function (x, i) {
      var v = x.r7 || 0;
      var w = Math.min(100, Math.abs(v) / maxAbs * 100);
      var c = v >= 0 ? 'var(--rise)' : 'var(--fall)';
      return '<div class="brow"><span class="idx">' + (i + 1) + '</span>' +
        '<span class="n" title="' + esc(x.n) + '">' + esc(x.n) + '</span>' +
        '<div class="btrack" style="max-width:120px"><div class="bfill" style="width:' + w + '%;background:' + c + '"></div></div>' +
        '<span class="v" style="color:' + c + '">' + sgn(v) + '%</span></div>';
    }).join('');
  };
  document.getElementById('gainersList').innerHTML = rows(p.top_gainers, 1);
  document.getElementById('losersList').innerHTML = rows(p.top_losers, -1);
  document.getElementById('pftNote').textContent =
    '口径：涨跌幅为近 7 日价格变化（r7）；总市值按最新价 × 持有量，未计手续费。';
}

/* ── ② AI 市场日报（文本 + 统计引擎数据榜）── */
function renderAiDaily(a) {
  if (!a || !a.report) { document.getElementById('aiDailySection').style.display = 'none'; return; }
  document.getElementById('aiDailySection').style.display = '';
  document.getElementById('aiDailyBox').textContent = a.report;
  var st = a.stats || {};
  /* 涨跌榜：stats 里是统计引擎算好的事实（r7=近7日，p=现价） */
  function rank(list, dir) {
    if (!list || !list.length) return '<div class="empty">暂无数据</div>';
    var maxAbs = 0.01;
    list.forEach(function (x) { maxAbs = Math.max(maxAbs, Math.abs(parseFloat(x.r7) || 0)); });
    return list.map(function (x, i) {
      var v = parseFloat(x.r7) || 0;
      var c = v >= 0 ? 'var(--rise)' : 'var(--fall)';
      var p = parseFloat(x.p) || 0;
      return '<div class="brow"><span class="idx">' + (i + 1) + '</span>' +
        '<span class="n" title="' + esc(x.n) + '">' + esc(x.n) + '</span>' +
        '<div class="btrack" style="max-width:110px"><div class="bfill" style="width:' + (Math.abs(v) / maxAbs * 100) + '%;background:' + c + '"></div></div>' +
        '<span class="v" style="color:' + c + '">' + sgn(v) + '% · ¥' + p.toFixed(2) + '</span></div>';
    }).join('');
  }
  document.getElementById('mktGainers').innerHTML = rank(st.gainers, 1);
  document.getElementById('mktLosers').innerHTML = rank(st.losers, -1);
  var tiers = st.tiers || {};
  var tk = Object.keys(tiers);
  document.getElementById('mktTiers').innerHTML = tk.length
    ? '<div class="note">价格分布：' + tk.map(function (k) { return esc(k) + ' 元 × ' + tiers[k] + ' 件'; }).join('　·　') + '</div>'
    : '';
  document.getElementById('aiDailyMeta').innerHTML =
    '<span>报告日期 ' + esc(a.date || '') + '</span>' +
    '<span>生成于 ' + esc((a.generated || '').slice(0, 16)) + '</span>' +
    '<span>涨跌榜为 market_scan 统计引擎算出的 7 日涨幅，AI 文本仅为其注记</span>';
}

/* ── 加载 ── */
function renderAll(report) {
  if (!report) return;
  document.getElementById('reportDate').textContent =
    '📅 ' + report.date + ' · 生成于 ' + (report.generated || '').replace('T', ' ').slice(0, 16);
  renderPortfolio(report.portfolio, report.date);
}
loadReport().then(renderAll).catch(function () {});
loadAiDaily().then(renderAiDaily);

/* 数据更新后自动刷新（60s 轮询 data_status） */
(function () {
  var _l = Date.now();
  setInterval(function () {
    fetch('data_status.json?ts=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var ut = d.updated || '';
        if (ut && new Date(ut).getTime() > _l) {
          _l = new Date(ut).getTime();
          loadReport().then(renderAll);
          loadAiDaily().then(renderAiDaily);
        }
      }).catch(function () {});
  }, 60000);
})();
</script>
</body>
</html>
